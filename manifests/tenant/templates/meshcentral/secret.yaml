{{- if .Values.meshcentral.enabled }}
{{- $creds := .Values.meshcentral.credentials | default dict }}
{{- $mongo := .Values.meshcentral.mongodb | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: meshcentral
type: Opaque
stringData:
  MESHCENTRAL_USER: {{ required "meshcentral.credentials.user is required" $creds.user | quote }}
  MESHCENTRAL_PASSWORD: {{ required "meshcentral.credentials.password is required" $creds.password | quote }}
  MESHCENTRAL_CONFIG_KEY: {{ required "meshcentral.credentials.configKey is required" $creds.configKey | quote }}

---

apiVersion: v1
kind: Secret
metadata:
  name: meshcentral-mongodb
type: Opaque
stringData:
  # values must match the root user rendered by manifests/datasources/mongodb-meshcentral
  # (its init script creates only the root user, authSource=admin)
  MC_MONGO_USER: {{ required "meshcentral.mongodb.user is required" $mongo.user | quote }}
  MC_MONGO_PASSWORD: {{ required "meshcentral.mongodb.password is required" $mongo.password | quote }}
{{- end }}
