{{- if .Values.meshcentral.enabled }}
{{- $creds := .Values.meshcentral.credentials | default dict }}
{{- $mongo := .Values.meshcentral.mongodb | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: meshcentral
type: Opaque
stringData:
  MESHCENTRAL_USER: {{ $creds.user | default "mesh@openframe.io" | quote }}
  MESHCENTRAL_PASSWORD: {{ required "meshcentral.credentials.password must be set (no insecure default is provided)" $creds.password | quote }}
  MESHCENTRAL_CONFIG_KEY: {{ required "meshcentral.credentials.configKey must be set (no insecure default is provided)" $creds.configKey | quote }}

---

apiVersion: v1
kind: Secret
metadata:
  name: meshcentral-mongodb
type: Opaque
stringData:
  # defaults must match the root user rendered by manifests/datasources/mongodb-meshcentral
  # (its init script creates only the root user, authSource=admin)
  MC_MONGO_USER: {{ $mongo.user | default "root" | quote }}
  MC_MONGO_PASSWORD: {{ required "meshcentral.mongodb.password must be set (no insecure default is provided)" $mongo.password | quote }}
{{- end }}
