{{- if .Values.fleet.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: fleet-server
type: Opaque
stringData:
  FLEET_SETUP_ADMIN_PASSWORD: {{ required "fleet.setup.adminPassword is required" .Values.fleet.setup.adminPassword | quote }}

---

# fleet reads MYSQL_PASSWORD from this Secret in the release namespace
# (fleet.database.existingSecret); must match manifests/datasources/mysql-fleetmdm
apiVersion: v1
kind: Secret
metadata:
  name: fleetmdm-mysql
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ required "fleet.database.password is required" .Values.fleet.database.password | quote }}
{{- end }}
