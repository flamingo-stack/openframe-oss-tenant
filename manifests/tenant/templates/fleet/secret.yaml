{{- if .Values.fleet.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: fleet-server
type: Opaque
stringData:
  FLEET_SETUP_ADMIN_PASSWORD: {{ required "fleet.setupAdminPassword is required: set an explicit Fleet admin password (no insecure default is provided)" .Values.fleet.setupAdminPassword | quote }}

---

# fleet reads MYSQL_PASSWORD from this Secret in the release namespace
# (fleet.database.existingSecret); must match manifests/datasources/mysql-fleetmdm
apiVersion: v1
kind: Secret
metadata:
  name: fleetmdm-mysql
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ required "fleet.database.mysqlPassword is required: set an explicit MySQL password (no insecure default is provided)" .Values.fleet.database.mysqlPassword | quote }}
{{- end }}
