{{- if .Values.fleet.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: fleet-server
type: Opaque
stringData:
  FLEET_SETUP_ADMIN_PASSWORD: {{ required "fleet.setupAdminPassword is required (inject via ExternalSecret/sealed-secret, do not hardcode)" .Values.fleet.setupAdminPassword | quote }}

---

# fleet reads MYSQL_PASSWORD from this Secret in the release namespace
# (fleet.database.existingSecret); must match manifests/datasources/mysql-fleetmdm
apiVersion: v1
kind: Secret
metadata:
  name: fleetmdm-mysql
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ required "fleet.mysqlPassword is required (inject via ExternalSecret/sealed-secret, do not hardcode)" .Values.fleet.mysqlPassword | quote }}
{{- end }}
