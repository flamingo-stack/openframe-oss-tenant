{{- if .Values.fleet.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-server
data:
  FLEET_SERVER_ADDRESS: "fleet-service.{{ .Values.tenant.namespace }}.svc.cluster.local"
  FLEET_SERVER_PORT: "8080"
  FLEET_SERVER_QUERY_RESULTS_TTL: "720h"
  FLEET_SERVER_QUERY_RESULTS_CLEANUP_INTERVAL: "1h"
  FLEET_SETUP_ADMIN_EMAIL: {{ .Values.fleet.fleet.setup.adminEmail | quote }}
  test: "test"

---

# fleet reads its database wiring from this ConfigMap in the release namespace
# (fleet.database.existingConfigMap); values are sourced from .Values.fleetmdmMysql
# which must be kept in sync with manifests/datasources/mysql-fleetmdm (ideally via
# a shared values file consumed by both charts)
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetmdm-mysql
data:
  MYSQL_USER: {{ .Values.fleetmdmMysql.mysqlUser | quote }}
  MYSQL_DATABASE: {{ .Values.fleetmdmMysql.mysqlDatabase | quote }}
  FLEET_MYSQL_HOST: {{ .Values.fleetmdmMysql.fleetMysqlHost | quote }}
  FLEET_MYSQL_PORT: {{ .Values.fleetmdmMysql.fleetMysqlPort | quote }}
{{- end }}
