apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant
data:
  # openframe-config (Spring Cloud Config) location. Adjust the namespace if the
  # config server is not reachable at this address.
  SPRING_CONFIG_URL: "http://openframe-config.platform.svc.cluster.local:8888"

  # Kafka values (OSS runs a single kafka; the tenant listener points at it too)
  KAFKA_HOST: "kafka.datasources.svc.cluster.local"
  KAFKA_PORT: "{{ .Values.deployment.kafkaPort }}"
  KAFKA_TENANT_HOST: "kafka.datasources.svc.cluster.local"
  KAFKA_TENANT_PORT: "{{ .Values.deployment.kafkaPort }}"

  # Pinot values
  PINOT_CONTROLLER_HOST: "pinot-controller.datasources.svc.cluster.local"
  PINOT_CONTROLLER_PORT: "{{ .Values.deployment.pinotControllerPort }}"
  PINOT_BROKER_HOST: "pinot-broker.datasources.svc.cluster.local"
  PINOT_BROKER_PORT: "{{ .Values.deployment.pinotBrokerPort }}"

  # Cassandra values
  CASSANDRA_HOST: "cassandra.datasources.svc.cluster.local"
  CASSANDRA_PORT: "{{ .Values.deployment.cassandraPort }}"

  # Redis values (OSS runs a single bitnami redis, not a cluster; the key name
  # is kept because the services and fleet read REDIS_CLUSTER_NODES)
  REDIS_CLUSTER_NODES: "redis-master.datasources.svc.cluster.local:{{ .Values.deployment.redisPort }}"

  # Nats values
  NATS_HOST: "nats.datasources.svc.cluster.local"
  NATS_PORT: "{{ .Values.deployment.natsPort }}"

  # MongoDB values (per-pod DNS through the mongodb headless service)
  MONGODB_HOSTS: "{{- range $i := until (.Values.deployment.mongodbReplicas | int) }}{{- if $i }},{{- end }}mongodb-{{ $i }}.mongodb.datasources.svc.cluster.local:{{ $.Values.deployment.mongodbPort }}{{- end }}"

  SHARED_HOST_URL: "{{ .Values.deployment.publicDomain }}"
  TENANT_ID: "{{ .Values.tenant.uuid }}"
  TENANT_UUID: "{{ .Values.tenant.uuid }}"
  TENANT_NS: "{{ .Values.tenant.namespace }}"
