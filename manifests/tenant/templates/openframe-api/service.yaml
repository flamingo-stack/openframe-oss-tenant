{{- $saas := index .Values "openframe-saas" -}}
{{- $svc := index $saas "api" -}}
{{- if and $saas.enabled $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: openframe-api
  labels:
    app: openframe-api
spec:
  selector:
    app: openframe-api
  ports:
    - port: 8090
      targetPort: http
      name: http
    - port: 8091
      targetPort: management
      name: management
  type: ClusterIP
{{- end }}
