registerJob:
  enabled: true
  image:
    registry: ghcr.io/flamingo-stack/registry
    repository: curlimages/curl
    tag: "8.9.1"


nats:
  config:
    cluster:
      enabled: false

    jetstream:
      enabled: true
      fileStore:
        enabled: true
        dir: /data/jetstream
        pvc:
          size: 10Gi

    websocket:
      enabled: true
    monitor:
      enabled: true

    merge:
      pid_file: /var/run/nats/nats.pid
      $include: ../nats-custom-config/nats.conf


  container:
    image:
      registry: ghcr.io/flamingo-stack/registry
      repository: nats
      tag: 2.10-alpine
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    patch:
      - op: add
        path: /envFrom
        value:
          - secretRef:
              name: nats-credentials
      - op: add
        path: /volumeMounts/-
        value:
          name: nats-config
          mountPath: /etc/nats-config
      - op: add
        path: /volumeMounts/-
        value:
          name: nats-custom-config
          mountPath: /etc/nats-custom-config
      - op: add
        path: /volumeMounts/-
        value:
          name: pid
          mountPath: /var/run/nats
  podTemplate:
    patch:
      - op: add
        path: /spec/volumes/-
        value:
          name: nats-config
          configMap:
            name: nats-config
      - op: add
        path: /spec/volumes/-
        value:
          name: nats-custom-config
          configMap:
            name: nats-custom-config
      - op: add
        path: /spec/volumes/-
        value:
          name: pid
          emptyDir: {}
  statefulSet:
    merge:
      spec:
        revisionHistoryLimit: 2


  reloader:
    enabled: true
    image:
      registry: ghcr.io/flamingo-stack/registry
      repository: natsio/nats-server-config-reloader
      tag: 0.21.1
    patch:
      - op: add
        path: /volumeMounts/-
        value:
          name: nats-config
          mountPath: /etc/nats-config
      - op: add
        path: /volumeMounts/-
        value:
          name: nats-custom-config
          mountPath: /etc/nats-custom-config
      - op: add
        path: /volumeMounts/-
        value:
          name: pid
          mountPath: /var/run/nats


  promExporter:
    enabled: true
    image:
      registry: ghcr.io/flamingo-stack/registry
      repository: natsio/prometheus-nats-exporter
      tag: 0.18.0
    port: 7777


  service:
    enabled: true
    ports:
      nats:
        enabled: true
      websocket:
        enabled: true
      monitor:
        enabled: true
    merge:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "7777"
          prometheus.io/path: "/metrics"


  natsBox:
    enabled: false
