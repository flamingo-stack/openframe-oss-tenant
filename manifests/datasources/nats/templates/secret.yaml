apiVersion: v1
kind: Secret
metadata:
  name: nats-credentials
type: Opaque
stringData:
  ADMIN_USER: "admin"
  ADMIN_PASS: "{{ required \"nats.adminPassword must be set (e.g. via --set or a secrets file, not committed to git)\" .Values.nats.adminPassword }}"
  DEVICE_USER: "machine"
  SERVICE_USER: "service"
  SERVICE_PASS: "{{ required \"nats.servicePassword must be set (e.g. via --set or a secrets file, not committed to git)\" .Values.nats.servicePassword }}"

