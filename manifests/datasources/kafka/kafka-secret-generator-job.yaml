apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-secret-generator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: kafka-secret-generator-sa
      restartPolicy: Never
      containers:
        - name: generator
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

              if kubectl get secret kafka-auth -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "Secret kafka-auth already exists, nothing to do."
                exit 0
              fi

              echo "Creating kafka-auth secret..."

              CLIENT_PW=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)
              BROKER_PW=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)
              CLUSTER_ID=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 16)

              kubectl -n "$NAMESPACE" create secret generic kafka-auth \
                --from-literal=client-password="$CLIENT_PW" \
                --from-literal=broker-password="$BROKER_PW" \
                --from-literal=cluster-id="$CLUSTER_ID"

              echo "kafka-auth secret created."
