
redis-cluster:
  fullnameOverride: redis-cluster

  global:
    security:
      allowInsecureImages: true  # bitnamilegacy

  image:
    registry: ghcr.io/flamingo-stack/registry
    repository: bitnamilegacy/redis-cluster
    tag: 7.4.2-debian-12-r2

  usePassword: false

  # 3 masters, no replicas — smallest valid redis cluster.
  # INVARIANT: this value must equal deployment.redisClusterNodes in
  # manifests/tenant/values.yaml, which is used to generate the
  # REDIS_CLUSTER_NODES seed list in the tenant configmap. There is no
  # automated cross-chart check for this today (Helm does not support a
  # shared global across independently-installed charts here), so any
  # change to this number MUST be mirrored manually in
  # manifests/tenant/values.yaml. TODO: consider consolidating both charts
  # under a parent chart with a shared `global.redisClusterNodes` value to
  # remove this manual invariant.
  cluster:
    init: true
    nodes: 3
    replicas: 0

  redis:
    useHostnames: false
    configmap: |-
      maxmemory 200mb
      maxmemory-policy allkeys-lru
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 250m
    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 30

  persistence:
    size: 2Gi

  metrics:
    enabled: true
    image:
      registry: ghcr.io/flamingo-stack/registry
      repository: bitnamilegacy/redis-exporter
      tag: 1.76.0-debian-12-r0
    podAnnotations:
      loki.grafana.com/scrape: "true"
      prometheus.io/scrape: "true"
      prometheus.io/port: "9121"
      prometheus.io/path: "/metrics"

