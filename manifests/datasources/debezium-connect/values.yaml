registerJob:
  enabled: true
  image:
    registry: ghcr.io/flamingo-stack/registry
    tag: "8.9.1"

image:
  repository: quay.io/debezium/connect
  tag: 3.1.1.Final

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

probes:
  liveness:
    enabled: true
  readiness:
    enabled: true

metrics:
  enabled: true
  port: 9404
  jmx:
    version: "1.0.1"
    image:
      repository: busybox
      tag: "1.36"
