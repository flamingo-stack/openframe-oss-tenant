apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connect
data:
  BOOTSTRAP_SERVERS: "kafka-broker-headless.datasources.svc.cluster.local:9092"
  CONFIG_STORAGE_TOPIC: "connect-configs"
  OFFSET_STORAGE_TOPIC: "connect-offsets"
  STATUS_STORAGE_TOPIC: "connect-status"
  CONNECT_PLUGIN_PATH: "/kafka/connect"
  {{- if .Values.metrics.enabled }}
  KAFKA_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar={{ .Values.metrics.port }}:/opt/jmx-exporter/config.yaml"
  {{- end }}

  # Log4j configuration for logfmt format
  CONNECT_LOG4J_LOGGERS: "INFO, stdout"
  CONNECT_LOG4J_APPENDER_STDOUT_LAYOUT_CONVERSIONPATTERN: "level=%p ts=%d{ISO8601} logger=%c thread=%t msg=\"%m\"%n"
