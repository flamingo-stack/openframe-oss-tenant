apiVersion: v1
kind: Secret
metadata:
  name: fleetmdm-mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ required "mysql-fleetmdm: .Values.mysql.rootPassword is required (do not hardcode credentials)" .Values.mysql.rootPassword | quote }}
  MYSQL_PASSWORD: {{ required "mysql-fleetmdm: .Values.mysql.password is required (do not hardcode credentials)" .Values.mysql.password | quote }}
  MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: "mysql_native_password"

