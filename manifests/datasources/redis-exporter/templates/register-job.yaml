{{- if .Values.registerJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-exporter
  annotations:
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      {{- if ne .Values.registry.docker.password "" }}
      imagePullSecrets:
        - name: docker-pat-secret
      {{- end }}
      
      containers:
      - name: register
        image: curlimages/curl:8.5.0
        command:
          - /bin/sh
          - -euc
          - |
            echo "Registering Redis Exporter..."
            echo "Waiting for OpenFrame Management API to become reachable..."
            until curl --head --fail --silent http://openframe-management.microservices.svc.cluster.local:8096/management/v1/health; do
              echo "Still waiting..."
              sleep 10
            done
              echo "Sending registration request..."
              http_code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
                -X POST "http://openframe-management.microservices.svc.cluster.local:8095/v1/tools/redis-exporter" \
                -H "Content-Type: application/json" \
                --connect-timeout 5 \
                --max-time 20 \
                -d '{
                "tool": {
                  "id": "redis-exporter",
                  "toolType": "REDIS_EXPORTER",
                  "name": "Redis Exporter",
                  "description": "Redis Metrics Exporter for Prometheus",
                  "toolUrls": [
                    {
                      "url": "http://redis-exporter.datasources.svc.cluster.local",
                      "port": "9121",
                      "type": "API"
                    }
                  ],
                  "category": "Monitoring",
                  "platformCategory": "OpenFrame Service",
                  "enabled": true,
                  "credentials": {},
                  "layer": "Monitoring",
                  "layerOrder": 5,
                  "layerColor": "#D84315",
                  "metricsPath": "/metrics",
                  "healthCheckEndpoint": "/metrics",
                  "healthCheckInterval": 30,
                  "connectionTimeout": 5000,
                  "readTimeout": 5000,
                  "allowedEndpoints": ["/metrics"],
                  "debeziumConnector": null
                }
              }')

              echo "HTTP $http_code"
              echo "----- Response body -----"
              cat /tmp/response.txt || true
              echo "-------------------------"

              if [ "$http_code" = "200" ]; then
                echo "Redis Exporter Registration complete."
                exit 0
              elif [ "$http_code" = "500" ]; then
                # Extract {"message":"..."} from JSON (tolerates spaces)
                ERR_MSG=$(sed -n 's/.*"message"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/response.txt | head -n1)
                if [ -n "$ERR_MSG" ]; then
                  echo "Registration failed (500): $ERR_MSG"
                else
                  echo "Registration failed (500). See response above."
                fi
                exit 1
              else
                echo "Registration failed (unexpected HTTP $http_code)."
                exit 1
              fi
{{- end }}
