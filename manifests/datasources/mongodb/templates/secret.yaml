apiVersion: v1
kind: Secret
metadata:
  name: mongodb
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: {{ required "mongodb.rootUsername is required (set via --set or values from external secret store)" .Values.mongodb.rootUsername | b64enc }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "mongodb.rootPassword is required (set via --set or values from external secret store)" .Values.mongodb.rootPassword | b64enc }}
  MONGO_APP_PASSWORD: {{ required "mongodb.appPassword is required (set via --set or values from external secret store)" .Values.mongodb.appPassword | b64enc }}

