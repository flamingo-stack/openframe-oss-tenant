apiVersion: v1
kind: Secret
metadata:
  name: mongodb
  annotations:
    # NOTE: This manifest ships development-only fallback credentials.
    # For any non-local/dev deployment, override MONGO_INITDB_ROOT_PASSWORD
    # and MONGO_APP_PASSWORD with randomly-generated, per-install secrets
    # (e.g. via a pre-install Job, External Secrets Operator, or Helm
    # `--set` with values sourced from a secure secret manager). Do not
    # rely on the values committed here for production use.
type: Opaque
data:
  # MONGO_INITDB_ROOT_USERNAME: cm9vdA==  # base64(root)
  MONGO_INITDB_ROOT_USERNAME: b3BlbmZyYW1l  # base64(openframe)
  # WARNING: development-only default password. Override for any real deployment.
  MONGO_INITDB_ROOT_PASSWORD: cGFzc3dvcmQxMjM0NTY3ODk=  # base64(password123456789) - DEV ONLY, override in production
  # WARNING: development-only default password. Override for any real deployment.
  MONGO_APP_PASSWORD: cGFzc3dvcmQxMjM0NTY3ODk=  # base64(password123456789) - DEV ONLY, override in production

