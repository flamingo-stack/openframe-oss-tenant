
deployment:
  oss:
    ingress:
      localhost:
        enabled: true   # Enable localhost ingress with nginx
      ngrok:
        enabled: false  # Enable ngrok ingress for external access
        credentials:
          apiKey: ""
          authtoken: ""

repository:
  baseDir: manifests
  URL: https://github.com/flamingo-stack/openframe-oss-tenant.git
  branch: main


apps:
  namespace-platform:
    enabled: true
    project: default
    namespace: platform
    syncWave: "-1"
  namespace-datasources:
    enabled: true
    project: default
    namespace: datasources
    syncWave: "-1"
  namespace-microservices:
    enabled: true
    project: default
    namespace: microservices
