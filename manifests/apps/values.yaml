
deployment:
  ingress:
    localhost:
      enabled: true   # Enable localhost ingress with nginx
    ngrok:
      enabled: false  # Enable ngrok ingress for external access
      credentials:
        apiKey: ""
        authtoken: ""

repository:
  baseDir: manifests
  URL: https://github.com/flamingo-stack/openframe-oss-tenant.git
  branch: main


# ── Platform tier ──────────────────────────────────────────────────────────
# One Application per platform.apps entry, sourced from manifests/platform/<name>.
# ngrok-operator and ingress-nginx additionally follow deployment.ingress:
# localhost.enabled skips ngrok-operator, ngrok.enabled skips ingress-nginx.
#
# syncWave is used sparingly: -2 namespaces → -1 ingress (light, gates all
# user-facing access — first, not starved behind heavy statefulsets) → 0
# everything else → 1 tenant. In-wave dependencies (debezium→kafka,
# pinot→controller→zookeeper) are handled by initContainers in those charts.
platform:
  enabled: true
  namespace: platform
  project: platform
  apps:
    namespace-platform:
      enabled: true
      syncWave: "-2"
      namespace: default        # only creates the (cluster-scoped) platform ns → target default
    ngrok-operator:
      enabled: false
      syncWave: "-1"
    ingress-nginx:
      enabled: true
      syncWave: "-1"
    dev-tools:
      enabled: true
    openframe-config:
      enabled: true

# ── Datasources tier ───────────────────────────────────────────────────────
# One Application per datasources.apps entry, sourced from manifests/datasources/<name>.
datasources:
  enabled: true
  namespace: datasources
  project: datasources
  apps:
    namespace-datasources:
      enabled: true
      syncWave: "-2"
      namespace: default        # only creates the (cluster-scoped) datasources ns → target default
    cassandra:
      enabled: true
    debezium-connect:
      enabled: true
    kafka:
      enabled: true
    mongodb:
      enabled: true
    mongodb-meshcentral:
      enabled: true
    mysql-fleetmdm:
      enabled: true
    nats:
      enabled: true
    pinot:
      enabled: true
    redis-cluster:
      enabled: true
    zookeeper:
      enabled: true

# ── Tenant tier ────────────────────────────────────────────────────────────
# ONE Application sourcing the manifests/tenant umbrella (fleet, meshcentral
# and the openframe services). OSS is single-tenant, so this is a plain
# Application, not the fleet-driven ApplicationSet used on SaaS.
tenant:
  enabled: true
  id: "tenant-XXX-X-X"
  uuid: ""
  namespace: tenant
  project: tenant
  syncWave: "1"   # after all datasources + openframe-config are healthy
  # Extra values for the tenant umbrella (e.g. openframe-saas.image.tag);
  # deep-merged over the deployment block (tenant.values wins per key).
  values: {}

