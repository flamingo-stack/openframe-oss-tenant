global:
  imageRegistry: ghcr.io/flamingo-stack/registry

registerJob:
  enabled: true
  image:
    registry: ghcr.io/flamingo-stack/registry
    tag: "8.9.1"

servicemonitor:
  enabled: true

image:
  registry: ghcr.io/flamingo-stack/registry
  repository: grafana/promtail
  tag: "3.5.1"

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000

extraVolumes:
  - name: varlog
    hostPath:
      path: /var/promtail-log

extraVolumeMounts:
  - name: varlog
    mountPath: /var/promtail-log/host
    readOnly: true

config:
  clients:
    - url: http://loki.platform.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    extraRelabelConfigs:
      - source_labels: [__meta_kubernetes_namespace]
        action: drop
        regex: (kube-system|gmp-system|loki|promtail)
