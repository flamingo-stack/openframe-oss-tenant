grafana:
  ingress:
    enabled: false

  revisionHistoryLimit: 2

  resources:
    requests:
      cpu: 200m
      memory: 250Mi
    limits:
      cpu: 400m
      memory: 500Mi

  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  admin:
    existingSecret: "grafana"
    userKey: user         
    passwordKey: password

  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth.basic:
      enabled: true
    auth:
      disable_login_form: false
    security:
      allow_embedding: true
      cookie_samesite: strict

  serviceMonitor:
    enabled: true
    path: "/metrics"
    relabelings:
      - action: replace
        sourceLabels: [__meta_kubernetes_pod_name]
        targetLabel: pod
      - action: replace
        sourceLabels: [__meta_kubernetes_namespace]
        targetLabel: namespace
      - action: replace
        sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        targetLabel: app

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-kube-prometheus-prometheus.platform.svc.cluster.local:9090
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki.platform.svc.cluster.local:3100
          access: proxy
          jsonData:
            timeout: 60
            maxLines: 1000

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        ...

  extraVolumeMounts:
    ...

  extraVolumes:
    ...

  image:
    registry: docker.io
    repository: grafana/grafana
    tag: "11.1.0"
    sha: ""
    pullPolicy: IfNotPresent

  testFramework:
    image:
      registry: docker.io
      repository: bats/bats
      tag: "v1.4.1"
    imagePullPolicy: IfNotPresent

  downloadDashboardsImage:
    registry: docker.io
    repository: curlimages/curl
    tag: 8.9.1
    sha: ""
    pullPolicy: IfNotPresent

  initChownData:
    image:
      registry: docker.io
      repository: library/busybox
      tag: "1.31.1"
      sha: ""
      pullPolicy: IfNotPresent

  sidecar:
    image:
      registry: quay.io
      repository: kiwigrid/k8s-sidecar
      tag: 1.30.10
      sha: ""
      pullPolicy: IfNotPresent

  imageRenderer:
    image:
      registry: docker.io
      repository: grafana/grafana-image-renderer
      tag: latest
      sha: ""
      pullSecrets: []
      pullPolicy: Always
