apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    // ============================================
    // Kubernetes Pod Discovery
    // ============================================
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Relabel based on pod annotations
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Only keep pods with loki scrape annotation
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_loki_grafana_com_scrape"]
        regex         = "true"
        action        = "keep"
      }

      // Namespace label
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Pod name
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Container name
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // App label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      // App.kubernetes.io/name label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app_name"
      }

      // App.kubernetes.io/component label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "component"
      }

      // Node name
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    // ============================================
    // Log Collection from Kubernetes
    // ============================================
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.pods.receiver]
    }

    // ============================================
    // Log Processing Pipeline
    // ============================================
    loki.process "pods" {
      forward_to = [loki.write.default.receiver]

      // Parse JSON logs if present
      stage.json {
        expressions = {
          level   = "level",
          msg     = "msg",
          message = "message",
          logger  = "logger",
          error   = "error",
        }
        drop_malformed = true
      }

      // Extract level from common formats
      stage.regex {
        expression = "(?P<level>DEBUG|INFO|WARN|WARNING|ERROR|FATAL|TRACE)"
      }

      // Normalize log levels
      stage.replace {
        expression = "(?i)warning"
        replace    = "WARN"
        source     = "level"
      }

      // Add level label if extracted
      stage.labels {
        values = {
          level = "",
        }
      }

      // Add static cluster label
      stage.static_labels {
        values = {
          cluster = "openframe",
        }
      }
    }

    // ============================================
    // Loki Writer
    // ============================================
    loki.write "default" {
      endpoint {
        url = "http://loki.platform.svc.cluster.local:3100/loki/api/v1/push"

        batch_wait        = "1s"
        batch_size        = "1MiB"
        retry_on_http_429 = true
      }
      external_labels = {}
    }
