registerJob:
  enabled: true
  image:
    registry: ghcr.io/flamingo-stack/registry
    repository: curlimages/curl
    tag: "8.9.1"

mimir-distributed:
  # Global image configuration
  global:
    image:
      registry: ghcr.io/flamingo-stack/registry

  # Mimir configuration
  mimir:
    image:
      repository: grafana/mimir
      tag: "2.14.0"

    structuredConfig:
      # Multi-tenancy disabled for simplicity
      multitenancy_enabled: false

      # Use filesystem storage
      common:
        storage:
          backend: filesystem
          filesystem:
            dir: /data

      blocks_storage:
        backend: filesystem
        filesystem:
          dir: /data/blocks
        tsdb:
          dir: /data/tsdb

      # Limits
      limits:
        ingestion_rate: 50000
        max_global_series_per_user: 1000000
        compactor_blocks_retention_period: 30d

      # Compactor
      compactor:
        data_dir: /data/compactor
        sharding_ring:
          kvstore:
            store: memberlist

      # Ingester - single instance
      ingester:
        ring:
          replication_factor: 1
          kvstore:
            store: memberlist

      # Store gateway - single instance
      store_gateway:
        sharding_ring:
          replication_factor: 1
          kvstore:
            store: memberlist

      # Activity tracker
      activity_tracker:
        filepath: /data/activity/activity.log

  # =====================================================
  # DISABLE ALL DISTRIBUTED COMPONENTS
  # =====================================================

  # Distributor
  distributor:
    replicas: 0
    resources: null

  # Ingester - disable zone-aware, use single statefulset
  ingester:
    replicas: 0
    zoneAwareReplication:
      enabled: false
    resources: null

  # Querier
  querier:
    replicas: 0
    resources: null

  # Query Frontend
  query_frontend:
    replicas: 0
    resources: null

  # Query Scheduler
  query_scheduler:
    replicas: 0
    resources: null

  # Store Gateway
  store_gateway:
    replicas: 0
    zoneAwareReplication:
      enabled: false
    resources: null

  # Compactor
  compactor:
    replicas: 0
    resources: null

  # =====================================================
  # DISABLE ALL OPTIONAL COMPONENTS
  # =====================================================
  ruler:
    enabled: false
  alertmanager:
    enabled: false
  overrides_exporter:
    enabled: false
  gateway:
    enabled: false
  nginx:
    enabled: false
  minio:
    enabled: false
  rollout_operator:
    enabled: false
  graphite:
    enabled: false
  metaMonitoring:
    enabled: false
  continuous_test:
    enabled: false

  # Chunks cache
  chunks-cache:
    enabled: false
  index-cache:
    enabled: false
  metadata-cache:
    enabled: false
  results-cache:
    enabled: false

  # Service account
  serviceAccount:
    create: true
