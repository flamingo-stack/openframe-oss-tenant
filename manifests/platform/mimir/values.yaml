registerJob:
  enabled: true
  image:
    registry: ghcr.io/flamingo-stack/registry
    repository: curlimages/curl
    tag: "8.9.1"

mimir-distributed:
  # Use monolithic mode - single deployment instead of microservices
  deploymentMode: monolithic

  # Global image configuration
  global:
    image:
      registry: ghcr.io/flamingo-stack/registry

  # Monolithic Mimir (single pod with all components)
  mimir:
    image:
      repository: grafana/mimir
      tag: "2.14.0"

    structuredConfig:
      # Multi-tenancy disabled for simplicity
      multitenancy_enabled: false

      # Use filesystem storage (GCS commented out for now)
      common:
        storage:
          backend: filesystem
          filesystem:
            dir: /data

      blocks_storage:
        backend: filesystem
        filesystem:
          dir: /data/blocks
        tsdb:
          dir: /data/tsdb

      # Limits
      limits:
        ingestion_rate: 50000
        max_global_series_per_user: 1000000
        compactor_blocks_retention_period: 30d

      # Compactor
      compactor:
        data_dir: /data/compactor
        sharding_ring:
          kvstore:
            store: memberlist

      # Ingester
      ingester:
        ring:
          replication_factor: 1
          kvstore:
            store: memberlist

      # Store gateway
      store_gateway:
        sharding_ring:
          replication_factor: 1
          kvstore:
            store: memberlist

      # Activity tracker disabled
      activity_tracker:
        filepath: ""

  # Single monolithic deployment
  monolithic:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
    persistentVolume:
      enabled: true
      size: 30Gi
    podAnnotations:
      loki.grafana.com/scrape: "true"
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"

  # Disable all distributed components
  distributor:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  query_frontend:
    replicas: 0
  query_scheduler:
    replicas: 0
  store_gateway:
    replicas: 0
  compactor:
    replicas: 0

  # Disable optional components
  ruler:
    enabled: false
  alertmanager:
    enabled: false
  overrides_exporter:
    enabled: false
  minio:
    enabled: false
  nginx:
    enabled: false
  gateway:
    enabled: false
  rollout_operator:
    enabled: false

  # Service account
  serviceAccount:
    create: true

  # GCS configuration (commented out for now)
  # To enable GCS, change common.storage.backend to "gcs" and add:
  # common:
  #   storage:
  #     backend: gcs
  #     gcs:
  #       bucket_name: "your-mimir-bucket"
