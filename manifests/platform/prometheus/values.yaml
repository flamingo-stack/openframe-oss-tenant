registerJob:
  enabled: true
  image:
    registry: ghcr.io/flamingo-stack/registry
    repository: curlimages/curl
    tag: "8.9.1"


prometheus:
  server:
    image:
      repository: ghcr.io/flamingo-stack/registry/prometheus/prometheus
      tag: v3.7.3
    podAnnotations:
      loki.grafana.com/scrape: "true"

    retention: "3d"

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi

    persistentVolume:
      enabled: true
      size: 15Gi

    # Enable remote write receiver for Alloy
    extraFlags:
      - "web.enable-remote-write-receiver"

    # Scrape interval (for self-scrape only)
    global:
      scrape_interval: 30s
      evaluation_interval: 15s

  # Disable sub-charts - not needed when Alloy handles collection
  prometheus-node-exporter:
    enabled: false

  kube-state-metrics:
    enabled: false

  alertmanager:
    enabled: false

  prometheus-pushgateway:
    enabled: false

  # Simplified scrape configs - Alloy handles all external scraping
  # Prometheus only scrapes itself for internal metrics
  serverFiles:
    prometheus.yml:
      scrape_configs:
        # Scrape Prometheus itself (required for internal metrics)
        - job_name: prometheus
          static_configs:
            - targets:
                - localhost:9090
