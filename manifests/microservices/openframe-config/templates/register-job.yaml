{{- if .Values.registerJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openframe-config
  annotations:
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      {{- if ne .Values.registry.docker.password "" }}
      imagePullSecrets:
        - name: docker-pat-secret
      {{- end }}
      
      containers:
      - name: register
        image: curlimages/curl:8.5.0
        command:
          - /bin/sh
          - -euc
          - |
            echo "Registering OpenFrame Config..."
            echo "Waiting for OpenFrame Management API to become reachable..."
            until curl --head --fail --silent http://openframe-management.microservices.svc.cluster.local:8096/management/v1/health; do
              echo "Still waiting..."
              sleep 10
            done
              echo "Sending registration request..."
              http_code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
                -X POST "http://openframe-management.microservices.svc.cluster.local:8095/v1/tools/openframe-config" \
                -H "Content-Type: application/json" \
                --connect-timeout 5 \
                --max-time 20 \
                -d '{
                "tool": {
                  "id": "openframe-config",
                  "toolType": "OPENFRAME",
                  "name": "OpenFrame Config",
                  "description": "OpenFrame Configuration Service",
                  "toolUrls": [
                    {
                      "url": "http://openframe-config.microservices.svc.cluster.local",
                      "port": "8090",
                      "type": "API"
                    }
                  ],
                  "category": "Configuration",
                  "platformCategory": "OpenFrame Core",
                  "enabled": true,
                  "credentials": {},
                  "layer": "Configuration",
                  "layerOrder": 1,
                  "layerColor": "#FFB74D",
                  "metricsPath": "/metrics",
                  "healthCheckEndpoint": "/health",
                  "healthCheckInterval": 30,
                  "connectionTimeout": 5000,
                  "readTimeout": 5000,
                  "allowedEndpoints": ["/api/v1/*", "/metrics"],
                  "debeziumConnectors": []
                }
              }')

              [ "$http_code" = 200 ] && { echo "OpenFrame Config Registration complete."; exit 0; }
              [ "$http_code" = 500 ] && { echo "OpenFrame Config Registration failed 500"; echo "----- Response body -----"; cat /tmp/response.txt || true; echo "-------------------------"; exit 1; }
              echo "OpenFrame Config Registration failed (HTTP ${http_code:-n/a})"; exit 1
{{- end }}
