apiVersion: v1
kind: Service
metadata:
  name: openframe-frontend
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: openframe-frontend
spec:
  selector:
    app: openframe-frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
