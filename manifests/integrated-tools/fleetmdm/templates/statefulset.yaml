apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleetmdm-server
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  serviceName: fleetmdm-server
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: fleetmdm-server
  template:
    metadata:
      labels:
        app: fleetmdm-server
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
      - name: ghcr-secret

      initContainers:
      # Wait for MySQL to be ready
      - name: wait-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z fleetmdm-mysql-0.fleetmdm-mysql.integrated-tools.svc.cluster.local 3306; do echo waiting for mysql; sleep 2; done']

      # Wait for Redis to be ready
      - name: wait-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z fleetmdm-redis-0.fleetmdm-redis.integrated-tools.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done']

      # Run database migrations
      - name: db-migrate
        image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
        command: ['fleet', 'prepare', 'db', '--no-prompt']
        envFrom:
        - configMapRef:
            name: fleetmdm-server
        - secretRef:
            name: fleetmdm-server
        env:
        - name: FLEET_MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: fleetmdm-mysql
              key: MYSQL_DATABASE
        - name: FLEET_MYSQL_USERNAME
          valueFrom:
            configMapKeyRef:
              name: fleetmdm-mysql
              key: MYSQL_USER
        - name: FLEET_MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleetmdm-mysql
              key: MYSQL_PASSWORD

      containers:
      - name: fleetmdm
        image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
        args: ['fleet', 'serve']
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: fleetmdm-server
        - secretRef:
            name: fleetmdm-server
        env:
        - name: FLEET_MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: fleetmdm-mysql
              key: MYSQL_DATABASE
        - name: FLEET_MYSQL_USERNAME
          valueFrom:
            configMapKeyRef:
              name: fleetmdm-mysql
              key: MYSQL_USER
        - name: FLEET_MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleetmdm-mysql
              key: MYSQL_PASSWORD
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: fleet-logs
          mountPath: /logs

  volumeClaimTemplates:
  - metadata:
      name: fleet-logs
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
