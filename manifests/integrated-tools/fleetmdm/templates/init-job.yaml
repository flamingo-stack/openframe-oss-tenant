apiVersion: batch/v1
kind: Job
metadata:
  name: fleetmdm-init
  annotations:
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
    "argocd.argoproj.io/sync-wave": "0"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: fleetmdm-init
      containers:
      - name: fleet-init
        image: {{ .Values.registerJob.image.registry }}/{{ .Values.registerJob.image.repository }}:{{ .Values.registerJob.image.tag }}
        envFrom:
        - configMapRef:
            name: fleetmdm-server
        - secretRef:
            name: fleetmdm-server
        command:
        - /bin/sh
        - -c
        - |
          set -e

          FLEET_URL="http://fleetmdm-server.integrated-tools.svc.cluster.local:8070"

          echo "Waiting for Fleet to be ready..."
          until curl -sf "${FLEET_URL}/healthz" >/dev/null 2>&1; do
            echo "Fleet not ready yet, waiting..."
            sleep 5
          done
          echo "Fleet is ready!"

          # Check if setup is needed (404 means already setup)
          SETUP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${FLEET_URL}/api/v1/setup")
          echo "Setup endpoint status: $SETUP_STATUS"

          if [ "$SETUP_STATUS" != "404" ]; then
            echo "Performing initial Fleet setup..."
            cat > /tmp/setup.json << EOF
          {
            "admin": {
              "email": "${FLEET_SETUP_ADMIN_EMAIL}",
              "name": "${FLEET_SETUP_ADMIN_NAME:-Admin}",
              "password": "${FLEET_SETUP_ADMIN_PASSWORD}"
            },
            "org_info": {
              "org_name": "${FLEET_SETUP_ORG_NAME}"
            },
            "server_url": "${FLEET_URL}"
          }
          EOF
            SETUP_RESPONSE=$(curl -s -X POST "${FLEET_URL}/api/v1/setup" \
              -H "Content-Type: application/json" \
              -d @/tmp/setup.json)
            echo "Setup response: $SETUP_RESPONSE"

            ADMIN_TOKEN=$(echo "$SETUP_RESPONSE" | jq -r '.token // empty')
            if [ -n "$ADMIN_TOKEN" ]; then
              echo "Got admin token from setup"
            fi
          else
            echo "Fleet already initialized (setup returned 404)"
          fi

          # If we don't have a token yet, try to login
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Logging in as admin..."
            cat > /tmp/login.json << EOF
          {"email":"${FLEET_SETUP_ADMIN_EMAIL}","password":"${FLEET_SETUP_ADMIN_PASSWORD}"}
          EOF
            LOGIN_RESPONSE=$(curl -s -X POST "${FLEET_URL}/api/v1/fleet/login" \
              -H "Content-Type: application/json" \
              -d @/tmp/login.json)
            echo "Login response: $LOGIN_RESPONSE"

            ADMIN_TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.token // empty')
          fi

          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ERROR: Failed to get admin token. Fleet may have different credentials."
            echo "Please check FLEET_SETUP_ADMIN_EMAIL and FLEET_SETUP_ADMIN_PASSWORD"
            exit 1
          fi
          echo "Got admin token"

          # Check if API user exists
          echo "Checking existing users..."
          USERS_RESPONSE=$(curl -s "${FLEET_URL}/api/v1/fleet/users" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}")

          API_USER_EXISTS=$(echo "$USERS_RESPONSE" | jq -r '.users[]? | select(.email == "'"${FLEET_API_USER_EMAIL}"'") | .id // empty')

          if [ -z "$API_USER_EXISTS" ]; then
            echo "Creating API user..."
            cat > /tmp/apiuser.json << EOF
          {
            "name": "${FLEET_API_USER_NAME}",
            "email": "${FLEET_API_USER_EMAIL}",
            "password": "${FLEET_API_USER_PASSWORD}",
            "global_role": "admin",
            "api_only": true
          }
          EOF
            API_USER_RESPONSE=$(curl -s -X POST "${FLEET_URL}/api/v1/fleet/users/admin" \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @/tmp/apiuser.json)
            echo "API user response: $API_USER_RESPONSE"

            API_TOKEN=$(echo "$API_USER_RESPONSE" | jq -r '.user.api_token // empty')

            if [ -z "$API_TOKEN" ]; then
              echo "WARNING: Could not extract api_token from response. Trying to login as API user..."
            fi
          else
            echo "API user already exists (id: $API_USER_EXISTS)"
          fi

          # If we don't have API token, try to login as API user
          if [ -z "$API_TOKEN" ]; then
            echo "Logging in as API user to get token..."
            cat > /tmp/apilogin.json << EOF
          {"email":"${FLEET_API_USER_EMAIL}","password":"${FLEET_API_USER_PASSWORD}"}
          EOF
            API_LOGIN_RESPONSE=$(curl -s -X POST "${FLEET_URL}/api/v1/fleet/login" \
              -H "Content-Type: application/json" \
              -d @/tmp/apilogin.json)
            echo "API login response: $API_LOGIN_RESPONSE"

            API_TOKEN=$(echo "$API_LOGIN_RESPONSE" | jq -r '.token // empty')
          fi

          if [ -z "$API_TOKEN" ]; then
            echo "WARNING: Could not obtain API token. Using admin token instead."
            API_TOKEN="$ADMIN_TOKEN"
          fi

          echo "Storing token in Secret..."

          kubectl create secret generic fleetmdm-api-token \
            --namespace=integrated-tools \
            --from-literal=token="${API_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Fleet initialization complete! API token stored in secret 'fleetmdm-api-token'"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetmdm-init

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleetmdm-init
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "update", "patch", "get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetmdm-init
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleetmdm-init
subjects:
- kind: ServiceAccount
  name: fleetmdm-init
