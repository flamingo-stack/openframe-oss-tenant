{{- if .Values.registerJob.enabled }}

apiVersion: batch/v1
kind: Job
metadata:
  name: fleetmdm-register
  annotations:
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
    "argocd.argoproj.io/sync-wave": "1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: register
        image: {{ .Values.registerJob.image.registry }}/{{ .Values.registerJob.image.repository }}:{{ .Values.registerJob.image.tag }}
        envFrom:
          - configMapRef:
              name: fleetmdm-mysql
          - secretRef:
              name: fleetmdm-mysql
        env:
        - name: FLEET_API_USER_EMAIL
          valueFrom:
            configMapKeyRef:
              name: fleetmdm-server
              key: FLEET_API_USER_EMAIL
        - name: FLEET_API_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleetmdm-server
              key: FLEET_API_USER_PASSWORD
        - name: FLEET_TOKEN
          valueFrom:
            secretKeyRef:
              name: fleetmdm-api-token
              key: token
        command:
          - /bin/sh
          - -c
          - |
            echo "Registering FleetMDM Server with OpenFrame..."

            # Wait for init job to create the secret
            echo "Waiting for API token secret..."
            until kubectl get secret fleetmdm-api-token -n integrated-tools 2>/dev/null; do
              echo "Waiting for fleetmdm-api-token secret..."
              sleep 5
            done

            # Read token from secret
            FLEET_TOKEN=$(kubectl get secret fleetmdm-api-token -n integrated-tools -o jsonpath='{.data.token}' | base64 -d)

            if [ -z "$FLEET_TOKEN" ]; then
              echo "Failed to get FLEET_TOKEN from secret"
              exit 1
            fi

            echo "Waiting for OpenFrame Management API to become reachable..."
            until curl --head --fail --silent http://openframe-management.microservices.svc.cluster.local:8096/management/v1/health; do
              echo "Still waiting..."
              sleep 10
            done

            echo "Sending registration request..."
            http_code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
              -X POST "http://openframe-management.microservices.svc.cluster.local:8095/v1/tools/fleetmdm-server" \
              -H "Content-Type: application/json" \
              --connect-timeout 5 \
              --max-time 20 \
              -d '{
                "tool": {
                  "id": "fleetmdm-server",
                  "toolType": "FLEET_MDM",
                  "name": "FleetMDM Server",
                  "description": "Fleet Device Management Platform",
                  "toolUrls": [
                    {
                      "url": "http://fleetmdm-server.integrated-tools.svc.cluster.local",
                      "port": "8070",
                      "type": "API"
                    },
                    {
                      "url": "http://fleetmdm-server.integrated-tools.svc.cluster.local",
                      "port": "8070",
                      "type": "DASHBOARD"
                    }
                  ],
                  "category": "Device Management",
                  "platformCategory": "Integrated Tool",
                  "enabled": true,
                  "credentials": {
                    "username": "'"${FLEET_API_USER_EMAIL}"'",
                    "password": "'"${FLEET_API_USER_PASSWORD}"'",
                    "apiKey": {
                      "key": "'"${FLEET_TOKEN}"'",
                      "type": "BEARER_TOKEN"
                    }
                  },
                  "layer": "Integrated Tools",
                  "layerOrder": 4,
                  "layerColor": "#455A64",
                  "metricsPath": "/metrics",
                  "healthCheckEndpoint": "/healthz",
                  "healthCheckInterval": 30,
                  "connectionTimeout": 5000,
                  "readTimeout": 5000,
                  "allowedEndpoints": ["/api/v1/*","/metrics"],
                  "debeziumConnectors": [{
                    "name": "fleet-mysql-connector",
                    "config": {
                      "connector.class": "io.debezium.connector.mysql.MySqlConnector",
                      "tasks.max": "1",
                      "database.hostname": "fleetmdm-mysql-0.fleetmdm-mysql.integrated-tools.svc.cluster.local",
                      "database.port": "3306",
                      "database.user": "'"${MYSQL_USER}"'",
                      "database.password": "'"${MYSQL_PASSWORD}"'",
                      "database.server.name": "'"${MYSQL_DATABASE}"'",
                      "database.server.id": "1",
                      "database.include.list": "'"${MYSQL_DATABASE}"'",
                      "topic.prefix": "fleet_mysql",
                      "table.include.list": "'"${MYSQL_DATABASE}"'.activities,'"${MYSQL_DATABASE}"'.host_activities,'"${MYSQL_DATABASE}"'.query_results",
                      "topic.creation.default.replication.factor": 1,
                      "topic.creation.default.partitions": 10,
                      "topic.creation.default.cleanup.policy": "compact",
                      "topic.creation.default.compression.type": "lz4",
                      "transforms": "addHeaderQueryResult,addHeaderJSONType,route",
                      "tombstones.on.delete": "false",
                      "predicates": "isQueryResult",
                      "transforms.route.type": "io.debezium.transforms.ByLogicalTableRouter",
                      "transforms.route.topic.regex": "fleet_mysql\\.'"${MYSQL_DATABASE}"'\\.(.*)",
                      "transforms.route.topic.replacement": "fleet.$1.events",
                      "transforms.addHeaderQueryResult.type": "org.apache.kafka.connect.transforms.InsertHeader",
                      "transforms.addHeaderQueryResult.header": "message-type",
                      "transforms.addHeaderQueryResult.value.literal": "FLEET_MDM_QUERY_RESULT_EVENT",
                      "transforms.addHeaderQueryResult.predicate": "isQueryResult",
                      "transforms.addHeaderJSONType.type": "org.apache.kafka.connect.transforms.InsertHeader",
                      "transforms.addHeaderJSONType.header": "__TypeId__",
                      "transforms.addHeaderJSONType.value.literal": "com.openframe.kafka.model.debezium.CommonDebeziumMessage",
                      "transforms.addHeaderJSONType.predicate": "isQueryResult",
                      "snapshot.mode": "initial",
                      "include.schema.changes": "false",
                      "database.allowPublicKeyRetrieval": "true",
                      "database.useSSL": "false",
                      "schema.history.internal.kafka.topic": "fleet_mysql_schema_history",
                      "schema.history.internal.kafka.bootstrap.servers": "kafka-broker-headless.datasources.svc.cluster.local:9092",
                      "predicates.isQueryResult.type": "org.apache.kafka.connect.transforms.predicates.TopicNameMatches",
                      "predicates.isQueryResult.pattern": "fleet_mysql.'"${MYSQL_DATABASE}"'.query_results"
                    }
                  }]
                }
              }' \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors)

            echo "----- Response body -----"
            cat /tmp/response.txt || true
            echo "-------------------------"

            [ -z "$http_code" ] || [ "$http_code" != 200 ] && { echo "FleetMDM Server Registration failed..."; exit 1; }
            echo "FleetMDM Server Registration complete."

{{- end }}
