{{- if .Values.global.registerJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-postgres
  annotations:
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      {{- if ne .Values.registry.docker.password "" }}
      imagePullSecrets:
        - name: docker-pat-secret
      {{- end }}
      
      containers:
      - name: register
        image: curlimages/curl:8.5.0
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: authentik-postgres
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres
              key: POSTGRES_PASSWORD
        command:
          - /bin/sh
          - -euc
          - |
            echo "Registering Authentik PostgreSQL..."
            echo "Waiting for OpenFrame Management API to become reachable..."
            until curl --head --fail --silent http://openframe-management.microservices.svc.cluster.local:8096/management/v1/health; do
              echo "Still waiting..."
              sleep 10
            done
              echo "Sending registration request..."
              http_code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
                -X POST "http://openframe-management.microservices.svc.cluster.local:8095/v1/tools/authentik-postgres" \
                -H "Content-Type: application/json" \
                --connect-timeout 5 \
                --max-time 20 \
                -d '{
                "tool": {
                  "id": "authentik-postgres",
                  "toolType": "POSTGRESQL",
                  "name": "Authentik PostgreSQL",
                  "description": "PostgreSQL Database Backend for Authentik",
                  "toolUrls": [
                    {
                      "url": "postgresql://authentik-postgres-0.authentik-postgres.integrated-tools.svc.cluster.local",
                      "port": "5432",
                      "type": "DATABASE"
                    }
                  ],
                  "category": "SQL Database",
                  "platformCategory": "Integrated Tool",
                  "enabled": true,
                  "credentials": {
                    "username": "'"${POSTGRES_USER}"'",
                    "password": "'"${POSTGRES_PASSWORD}"'"
                  },
                  "layer": "Integrated Tools",
                  "layerOrder": 6,
                  "layerColor": "#3949AB",
                  "metricsPath": "/metrics",
                  "healthCheckEndpoint": "/",
                  "healthCheckInterval": 30,
                  "connectionTimeout": 5000,
                  "readTimeout": 5000,
                  "allowedEndpoints": ["/metrics"],
                  "debeziumConnectors": []
                }
              }')

              echo "HTTP $http_code"
              echo "----- Response body -----"
              cat /tmp/response.txt || true
              echo "-------------------------"

              if [ "$http_code" = "200" ]; then
                echo "Authentik PostgreSQL Registration complete."
                exit 0
              elif [ "$http_code" = "500" ]; then
                # Extract {"message":"..."} from JSON (tolerates spaces)
                ERR_MSG=$(sed -n 's/.*"message"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/response.txt | head -n1)
                if [ -n "$ERR_MSG" ]; then
                  echo "Registration failed (500): $ERR_MSG"
                else
                  echo "Registration failed (500). See response above."
                fi
                exit 1
              else
                echo "Registration failed (unexpected HTTP $http_code)."
                exit 1
              fi
{{- end }}
