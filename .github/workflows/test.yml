name: Openframe Test

# =============================================================================
# WORKFLOW CONFIGURATION
# =============================================================================

permissions:
  contents: write
  packages: write
  actions: write
  pull-requests: write
  attestations: write
  id-token: write
  pages: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'openframe/**'
      - 'integrated-tools/**'
      - 'pom.xml'
      - '.github/**'
      - 'manifests/**'
      - 'clients/**'
      - 'configs/**'
      - 'renovate.json'

concurrency:
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: "ghcr.io"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}


# =============================================================================
# JOBS
# =============================================================================

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/changes.yaml
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft

  lint:
    name: "YAML Lint"
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/steps/yaml-lint

  build_images:
    name: "Build: ${{ matrix.name }}"
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.images_matrix) }}
    steps:
      - name: Check if build should run
        id: should_run
        run: echo "run=${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && fromJSON(needs.changes.outputs.changes || '{}')[matrix.name] == 'true' }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        if: steps.should_run.outputs.run == 'true'
        with:
          fetch-depth: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: steps.should_run.outputs.run == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: steps.should_run.outputs.run == 'true'
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.should_run.outputs.run == 'true'

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        if: steps.should_run.outputs.run == 'true'
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORGANISATION }}/${{ env.REPOSITORY }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.changes.outputs.test_commit_sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          labels: |
            org.opencontainers.image.vendor=${{ env.ORGANISATION }}
            org.opencontainers.image.description=OpenFrame is a platform for building and deploying AI agents.
            org.opencontainers.image.licenses=Creative Commons Attribution-NonCommercial 4.0 International (CC BY-NC 4.0)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: docker_build
        if: steps.should_run.outputs.run == 'true'
        uses: nick-fields/retry@v4
        env:
          LIB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_LABELS: ${{ steps.meta.outputs.labels }}
        with:
          max_attempts: 3
          retry_wait_seconds: 5
          timeout_minutes: 30
          shell: bash
          command: |
            args=(--platform linux/amd64,linux/arm64 --push --provenance=false --sbom=true
                  --secret id=GITHUB_TOKEN,env=LIB_TOKEN
                  --build-arg GITHUB_ACTOR=${{ github.actor }}
                  -f "${{ matrix.path }}/Dockerfile")
            while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$META_TAGS"
            while IFS= read -r l; do [ -n "$l" ] && args+=(--label "$l"); done <<< "$META_LABELS"
            docker buildx build "${args[@]}" "${{ matrix.context || matrix.path }}"


  test_clients:
    name: "Test Rust Client: ${{ matrix.name }} on ${{ matrix.os }}"
    needs: [changes]
    runs-on: "${{ matrix.os }}-latest"
    env:
      CARGO_INCREMENTAL: 0
      BINARY_NAME: ${{ matrix.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.clients_matrix) }}

    steps:
      - name: Check if build should run
        id: should_run
        run: echo "run=${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && fromJSON(needs.changes.outputs.changes || '{}')[matrix.id || matrix.name] == 'true' }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        if: steps.should_run.outputs.run == 'true'
        with:
          fetch-depth: 1

      - name: Prepare Rust tools
        uses: ./.github/steps/rust-setup
        if: steps.should_run.outputs.run == 'true'
        with:
          path: ${{ matrix.path }}
          toolchain: stable
          targets: ${{ matrix.archs || matrix.target }}
          components: clippy, rustfmt
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Run lint
        working-directory: ${{ matrix.path }}
        if: steps.should_run.outputs.run == 'true'
        run: |
          make lint
        continue-on-error: true

      - name: Test client
        working-directory: ${{ matrix.path }}
        if: steps.should_run.outputs.run == 'true'
        run: |
          if [[ "${{ matrix.name }}" == "openframe-client" && "${{ matrix.os }}" == "macos" ]]; then
            IFS=',' read -ra ARCHITECTURES <<< "${{ matrix.target }}"
            for RUST_TARGET in "${ARCHITECTURES[@]}"; do
              RUST_TARGET=$(echo "$RUST_TARGET" | tr -d '[:space:]')
              make build TARGET="$RUST_TARGET"
            done
          elif [[ "${{ matrix.name }}" == "openframe-chat" && "${{ matrix.os }}" == "macos" ]]; then
            make build TARGET="${{ matrix.target }}" BUNDLES=app
          else
            make build TARGET="${{ matrix.target }}"
          fi

      - name: Sign Windows package
        if: steps.should_run.outputs.run == 'true' && runner.os == 'Windows'
        uses: ./.github/steps/sign-windows-package
        with:
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          signing_endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          code_signing_account_name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate_profile_name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          name: ${{ matrix.name }}
          target_path: ${{ matrix.target_path }}
          target: ${{ matrix.target }}

      - name: Upload Windows artifact
        if: steps.should_run.outputs.run == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}-${{ matrix.os }}"
          path: "${{ matrix.target_path }}/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe"
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9

      - name: Create macOS universal package
        if: steps.should_run.outputs.run == 'true' && runner.os == 'macOS' && matrix.name == 'openframe-client'
        shell: bash
        run: |
          mkdir -p artifacts
          IFS=',' read -ra ARCHITECTURES <<< "${{ matrix.target }}"
          RUST_TARGET_ARM64=${ARCHITECTURES[0]}
          RUST_TARGET_x64=${ARCHITECTURES[1]}
          RUST_TARGET_ARM64=$(echo "$RUST_TARGET_ARM64" | tr -d '[:space:]')
          RUST_TARGET_x64=$(echo "$RUST_TARGET_x64" | tr -d '[:space:]')
          lipo -create ${{ matrix.target_path }}/${RUST_TARGET_ARM64}/release/${{ env.BINARY_NAME }} ${{ matrix.target_path }}/${RUST_TARGET_x64}/release/${{ env.BINARY_NAME }} -output ./artifacts/${{ env.BINARY_NAME }}

          echo "Verify macOS openframe universal package"
          lipo -info ./artifacts/${{ env.BINARY_NAME }}
          file ./artifacts/${{ env.BINARY_NAME }}

      - name: Sign macOS package
        if: steps.should_run.outputs.run == 'true' && runner.os == 'macOS'
        uses: ./.github/steps/sign-macos-package
        with:
          apple_certificate_p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_id_username: ${{ secrets.APPLE_ID_USERNAME }}
          apple_id_password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          name: ${{ matrix.name }}
          target_path: ${{ matrix.target_path }}

      - name: Upload macOS client artifact
        if: steps.should_run.outputs.run == 'true' && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}-${{ matrix.os }}"
          path: artifacts/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9


  test_helm:
    name: "Test Helm Chart"
    needs: [changes]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      contains(fromJSON(needs.changes.outputs.changes || '{}').helm, 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.4.1

      - name: Test Chart
        run: |
          helm template app ./manifests/app-of-apps
          helm unittest ./manifests/app-of-apps


  cleanup:
    name: "Cleanup ${{ matrix.name }}"
    needs: [changes, build_images, test_clients, test_helm]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      needs.changes.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.images_matrix || '[]') }}
    steps:
      - uses: actions/checkout@v4
        if: contains(fromJSON(needs.changes.outputs.changes || '{}')[matrix.name], 'true')

      - name: Login to GitHub Registry
        if: contains(fromJSON(needs.changes.outputs.changes || '{}')[matrix.name], 'true')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Delete the CI tag
        if: contains(fromJSON(needs.changes.outputs.changes || '{}')[matrix.name], 'true')
        uses: dataaxiom/ghcr-cleanup-action@v1
        continue-on-error: true
        with:
          package: ${{ env.REPOSITORY }}/${{ matrix.name }}
          delete-ghost-images: true
          delete-tags: ${{ needs.changes.outputs.test_commit_sha }}


  all-checks:
    name: "All Checks"
    needs: [changes, lint, build_images, test, test_clients, test_helm, cleanup]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
