name: Release Prod

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

# =============================================================================
# JOBS
# =============================================================================

jobs:
  promote:
    name: "Create and Merge Release PR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PR_WRITE_ACCESS_TOKEN }}

      - name: Create and Merge Prod Release PR
        env:
          GH_TOKEN: ${{ secrets.PR_WRITE_ACCESS_TOKEN }}
          VALUES_PATH: manifests/apps
        run: |
          set -euo pipefail

          BRANCH_NAME="release/prod-$(date +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH_NAME"

          cp "${VALUES_PATH}/values-qa.yaml" "${VALUES_PATH}/values-prod.yaml"
          sed -i "s/environment: qa/environment: prod/g" "${VALUES_PATH}/values-prod.yaml"
          git add "${VALUES_PATH}/values-prod.yaml"
          git commit -m "Promote QA → Prod"

          # 👇 Override the remote temporarily (forces PAT instead of GITHUB_TOKEN)
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"

          # Now this push uses your PAT, not GITHUB_TOKEN
          git push -u origin "$BRANCH_NAME"

          # Create PR (this will trigger pull_request workflows)
          PR_URL=$(gh pr create \
            --title "Release QA → Prod (automated)" \
            --body "Automated promotion QA → Prod" \
            --base main \
            --head "$BRANCH_NAME")

          echo "✅ Created PR: $PR_URL"

          # Optional delay to let checks register
          sleep 10

          gh pr review "$PR_URL" --approve
          gh pr merge "$PR_URL" --squash --auto
