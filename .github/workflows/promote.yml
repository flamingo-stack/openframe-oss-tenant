name: Promote QA to PROD

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to Promote to PROD (e.g., v1.2.3)"
        required: true
        type: string

# =============================================================================
# JOBS
# =============================================================================

jobs:
  promote:
    name: "Create and Merge Promotion PR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PROD Promotion PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALUES_PATH: manifests/apps
        run: |
          git checkout -b prod-${{ inputs.version }}
          sed -i "s/tag: .*/tag: ${{ inputs.version }}/g" ${VALUES_PATH}/values-prod.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${VALUES_PATH}/values-prod.yaml
          git commit -m "Update Production to ${{ inputs.version }}"
          git push -u origin prod-${{ inputs.version }} --force
          PR_URL=$(gh pr create --title "Release ${{ inputs.version }} (PROD promotion)" --body "Update Production tags to ${{ inputs.version }}" --base main)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Merge PROD Promotion PR
        env:
          GH_TOKEN: ${{ secrets.PR_WRITE_ACCESS_TOKEN }}
        run: |
          gh pr review "${{ steps.create_pr.outputs.pr_url }}" --approve
          gh pr merge "${{ steps.create_pr.outputs.pr_url }}" --squash --auto
