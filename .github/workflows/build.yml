name: OpenFrame Build and Push Latest

permissions:
  contents: write
  packages: write
  actions: write
  pull-requests: write
  attestations: write
  id-token: write

on:
  push:
    branches: [main, feature/build-windows-client, feature/build-windows-client-kirill]
    paths:
      - 'manifests/**'
      - 'openframe/**'
      - 'integrated-tools/**'
      - 'pom.xml'
      - 'client/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.2.3)"
        required: true
        type: string

env:
  REGISTRY: "ghcr.io"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}
  # Cache optimization
  MAVEN_OPTS: "-Xmx4g -Xms2g -XX:+UseG1GC"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

# =============================================================================
# JOBS
# =============================================================================

jobs:
  # Disabled Java builds and Docker images - only Windows client needed
  # changes:
  #   name: Detect Changes
  #   uses: ./.github/workflows/changes.yml
  #   if: github.event_name == 'push'

  # matrix:
  #   name: Generate Matrix
  #   uses: ./.github/workflows/matrix.yml
  #   if: github.event_name == 'push'

  # build_java: [DISABLED - Server builds not needed]
  # build_images: [DISABLED - Docker images not needed]

  build_client:
    name: "Build Windows Client (${{ matrix.target }})"
    runs-on: windows-latest
    if: github.event_name == 'push'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: openframe-oss-client-windows-x64.exe
          - target: i686-pc-windows-msvc
            artifact_name: openframe-oss-client-windows-x32.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Rust tools
        uses: ./.github/steps/rust-setup
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
          shared-key: ${{ matrix.target }}

      - name: Build Windows client
        working-directory: client
        run: |
          make build TARGET=${{ matrix.target }}

      - name: Prepare Windows Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp "client/target/${{ matrix.target }}/release/openframe.exe" "artifacts/${{ matrix.artifact_name }}"
          # List what we're uploading
          ls -la artifacts/

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows client to GHCR as OCI artifact
        run: |
          # Install ORAS (OCI Registry As Storage)
          curl -LO https://github.com/oras-project/oras/releases/download/v1.1.0/oras_1.1.0_windows_amd64.zip
          unzip oras_1.1.0_windows_amd64.zip
          
          # Push binary as OCI artifact
          ./oras push ghcr.io/${{ env.ORGANISATION }}/${{ env.REPOSITORY }}/client-windows:${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x64' || 'x32' }} \
            artifacts/${{ matrix.artifact_name }}:application/octet-stream \
            --annotation "org.opencontainers.image.title=OpenFrame Windows Client" \
            --annotation "org.opencontainers.image.description=OpenFrame Windows client binary for ${{ matrix.target }}" \
            --annotation "org.opencontainers.image.version=${{ github.sha }}"
        shell: bash
