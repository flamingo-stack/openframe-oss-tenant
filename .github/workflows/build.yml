name: OpenFrame Build and Push Latest

permissions:
  contents: write
  packages: write
  actions: write
  pull-requests: write
  attestations: write
  id-token: write

on:
  push:
    branches: [main]
    paths:
      - 'manifests/**'
      - 'openframe/**'
      - 'integrated-tools/**'
      - 'pom.xml'
      - 'client/**'
  workflow_call:
    inputs:
      version:
        description: "version to release (e.g., v1.2.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "version to release (e.g., v1.2.3)"
        required: true
        type: string

env:
  REGISTRY: "ghcr.io"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}

# =============================================================================
# JOBS
# =============================================================================

jobs:
  changes:
    name: Detect Changes
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    uses: ./.github/workflows/changes.yml

  matrix:
    name: Generate Matrix
    uses: ./.github/workflows/matrix.yml
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

  build_images:
    name: "Build: ${{ matrix.name }}"
    needs: [matrix, changes]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        if: |
          github.event_name == 'workflow_call' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
        uses: actions/checkout@v4
        with:
          repository: flamingo-stack/openframe-oss-tenant
          ref: ami/ci
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Update pom.xml with lib version
        if: |
          (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') &&
          inputs.version != ''
        run: |
          VERSION="${{ inputs.version }}"
          echo "Updating openframe.libs.version to: $VERSION"
          
          sed -i "s|<openframe\.libs\.version>.*</openframe\.libs\.version>|<openframe.libs.version>${VERSION}</openframe.libs.version>|" pom.xml
          
          if grep -q "<openframe.libs.version>${VERSION}</openframe.libs.version>" pom.xml; then
            echo "✓ Successfully updated to: $VERSION"
            grep "openframe.libs.version" pom.xml
          else
            echo "✗ Failed to update version"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: |
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || 
          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: |
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || 
          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.name == 'fleetmdm' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

      - name: Set up Docker Buildx
        if: |
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || 
          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
        uses: docker/setup-buildx-action@v3

      - name: Generate metadata
        if: |
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || 
          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORGANISATION }}/${{ env.REPOSITORY }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=${{ needs.changes.outputs.commit_sha }}
            type=raw,value=${{ needs.changes.outputs.timestamp_tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
          labels: |
            org.opencontainers.image.vendor=${{ env.ORGANISATION }}
            org.opencontainers.image.description=OpenFrame is a platform for building and deploying AI agents.
            org.opencontainers.image.licenses=Creative Commons Attribution-NonCommercial 4.0 International (CC BY-NC 4.0)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Format build arguments
        if: |
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || 
          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
        id: format_args
        uses: flamingo-stack/openframe-oss-tenant/.github/steps/docker-format-build-args@ami/ci
        with:
          build_args: ${{ toJSON(matrix.build_args) }}
        env:
          BUILD_ARGS: ${{ steps.format_args.outputs.formatted_args }}

#      - name: Set up JDK 21
#        if: |
#          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') ||
#          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
#        uses: actions/setup-java@v4
#        with:
#          java-version: '21'
#          distribution: 'temurin'
#          cache: 'maven'
#
#      - name: Build Maven dependencies
#        if: |
#          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') ||
#          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
#        run: |
#          mvn clean install -DskipTests -pl '!${{ matrix.path }}' -am

      - name: Build and push image
        if: |
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || 
          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true'))
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          platforms: ${{ matrix.name == 'fleetmdm' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: false
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            ${{ env.BUILD_ARGS }}

      - name: Cleanup old container versions
        if: |
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || 
          (github.event_name == 'push' && contains(needs.changes.outputs[matrix.name], 'true')) && 
          steps.docker_build.outcome == 'success'
        uses: dataaxiom/ghcr-cleanup-action@v1
        continue-on-error: true
        with:
          package: ${{ env.REPOSITORY }}/${{ matrix.name }}
          delete-ghost-images: true
          delete-tags: "*"
          exclude-tags: latest,test-*,${{ needs.changes.outputs.commit_sha }},${{ needs.changes.outputs.timestamp_tag }}

  build_client:
    name: "Build Rust Client (${{ matrix.os }})"
    needs: [changes]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      BINARY_NAME: openframe
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && contains(needs.changes.outputs.client, 'true')
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifact_name: openframe-oss-client-macos-universal
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: openframe-oss-client-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: flamingo-stack/openframe-oss-tenant
          ref: ami/ci
          fetch-depth: 1

      - name: Prepare Rust tools
        uses: flamingo-stack/openframe-oss-tenant/.github/steps/rust-setup@ami/ci
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build client
        working-directory: client
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            IFS=',' read -ra ARCHITECTURES <<< "${{ matrix.target }}"
            for RUST_TARGET in "${ARCHITECTURES[@]}"; do
              RUST_TARGET=$(echo "$RUST_TARGET" | tr -d '[:space:]')
              make build TARGET="$RUST_TARGET"
            done
          else
            make build TARGET="${{ matrix.target }}"
          fi

      - name: Upload Rust Artifacts for Windows / Linux
        if: "!(runner.os == 'macOS')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "client/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Create macOS universal package
        if: "runner.os == 'macOS'"
        shell: bash
        run: |
          mkdir -p artifacts
          echo "Create ${{ matrix.artifact_name }}"
          IFS=',' read -ra ARCHITECTURES <<< "${{ matrix.target }}"
          RUST_TARGET_ARM64=${ARCHITECTURES[0]}
          RUST_TARGET_x64=${ARCHITECTURES[1]}
          RUST_TARGET_ARM64=$(echo "$RUST_TARGET_ARM64" | tr -d '[:space:]')
          RUST_TARGET_x64=$(echo "$RUST_TARGET_x64" | tr -d '[:space:]')
          lipo -create ./client/target/${RUST_TARGET_ARM64}/release/${{ env.BINARY_NAME }} ./client/target/${RUST_TARGET_x64}/release/${{ env.BINARY_NAME }} -output ./artifacts/${{ env.BINARY_NAME }}
          
          echo "Verify macOS openframe universal package"
          lipo -info ./artifacts/${{ env.BINARY_NAME }}
          file ./artifacts/${{ env.BINARY_NAME }}

      - name: Sign MacOS package
        if: "runner.os == 'macOS'"
        uses: ./.github/steps/sign-macos-package
        with:
          apple_certificate_p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_developer_id: ${{ secrets.APPLE_DEVELOPER_ID }}
          apple_id_username: ${{ secrets.APPLE_ID_USERNAME }}
          apple_id_password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          binary_name: ${{ env.BINARY_NAME }}

      - name: Upload macOS client artifact
        if: "runner.os == 'macOS'"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

  build_helm:
    name: "Build Helm Chart"
    needs: [matrix, changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0

      - name: Push Chart
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: app-of-apps
          tag: 0.1.1
          path: ./manifests/app-of-apps
          registry: ${{ env.REGISTRY }}
          repository: ${{ env.ORGANISATION }}/${{ env.REPOSITORY }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: "Create Release"
    needs: [ build_client, build_images, matrix, changes ]
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.version != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
        continue-on-error: true

      - name: Display artifact structure
        run: |
          if [ -d "release-artifacts" ]; then
            echo "Downloaded artifacts:"
            ls -R release-artifacts/
          else
            echo "No artifacts directory found"
          fi

      - name: Prepare release artifacts
        run: |
          mkdir -p final-artifacts/client

          # Copy client binaries
          if [ -d "release-artifacts" ]; then
            find release-artifacts -type f \( -name "openframe" -o -name "openframe.exe" \) \
              -exec cp {} final-artifacts/client/ \;
          fi

          echo "Final artifacts to release:"
          echo "=== Client artifacts ==="
          ls -lh final-artifacts/client/ 2>/dev/null || echo "No client artifacts"

      - name: Generate Docker image list
        id: docker_images
        run: |
          MATRIX='${{ needs.matrix.outputs.matrix }}'
          TAG="${{ github.event.inputs.version }}"

          IMAGE_LIST=$(echo "$MATRIX" | jq -r --arg registry "$REGISTRY" \
            --arg org "$ORGANISATION" \
            --arg repo "$REPOSITORY" \
            --arg tag "$TAG" \
            '.[] | "- `\($registry)/\($org)/\($repo)/\(.name):\($tag)`"' | tr '\n' '\n')

          PULL_COMMANDS=$(echo "$MATRIX" | jq -r --arg registry "$REGISTRY" \
            --arg org "$ORGANISATION" \
            --arg repo "$REPOSITORY" \
            --arg tag "$TAG" \
            '.[] | "docker pull \($registry)/\($org)/\($repo)/\(.name):\($tag)"' | tr '\n' '\n')

          {
            echo "images<<EOF"
            echo "$IMAGE_LIST"
            echo "EOF"
            echo "pull_commands<<EOF"
            echo "$PULL_COMMANDS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          ORGANISATION: ${{ env.ORGANISATION }}
          REPOSITORY: ${{ env.REPOSITORY }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            final-artifacts/client/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Release ${{ github.event.inputs.version }}

            Built from commit: ${{ github.sha }}

            ## 🦀 Client Binaries
            - **macOS** (Universal): `openframe` (ARM64 + x86_64)
            - **Windows** (x64): `openframe.exe`

            ## 🐳 Docker Images

            **Available images:**
            ${{ steps.docker_images.outputs.images }}

            **Pull commands:**
            ```bash
            ${{ steps.docker_images.outputs.pull_commands }}
            ```