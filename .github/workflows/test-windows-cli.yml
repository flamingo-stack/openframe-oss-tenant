name: Test Windows CLI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/test-windows-cli.yml'
  push:
    branches: [main, feat/windows-cli]
    paths:
      - 'cli/**'
  workflow_dispatch:

jobs:
  test-windows-cli:
    name: Test CLI on Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: cli/go.sum

      - name: Build Windows CLI binary
        shell: bash
        run: |
          cd cli
          go build -v -o openframe.exe .
          ls -lh openframe.exe

      - name: Check WSL2 status
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Checking WSL status..."
          wsl --status 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "WSL not fully configured yet" }
          wsl --list --verbose 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "No WSL distributions installed" }
          exit 0  # Ensure step exits successfully

      - name: Test prerequisite check (should detect missing tools)
        shell: powershell
        continue-on-error: true
        run: |
          cd cli
          Write-Host "Testing prerequisite checker..."
          .\openframe.exe cluster diagnose 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "Prerequisites check completed (missing tools detected as expected)" }
          exit 0  # Ensure step exits successfully

      - name: Install WSL2 and Ubuntu
        shell: powershell
        run: |
          Write-Host "Installing WSL2 and Ubuntu..."

          # Set error action to continue
          $ErrorActionPreference = 'Continue'

          # Install WSL with Ubuntu in one command, with yes to all prompts
          Write-Host "Running: wsl --install -d Ubuntu --no-launch"
          echo Y | wsl --install -d Ubuntu --no-launch

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Warning: WSL installation returned exit code $LASTEXITCODE"
            Write-Host "This is expected on some systems. Continuing..."
          }

          # Wait for installation to complete
          Write-Host "Waiting for installation to complete..."
          Start-Sleep -Seconds 20

          # Check status
          Write-Host "Checking WSL status after installation..."
          wsl --status
          wsl --list --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: WSL installation may have failed"
            Write-Host "Attempting to verify WSL availability..."
            wsl --help
            exit 1
          }

          # Initialize Ubuntu by running a simple command (this triggers first-time setup)
          Write-Host "Initializing Ubuntu (first launch)..."
          wsl -d Ubuntu -u root bash -c "echo 'Ubuntu initialized'" 2>&1 | Out-Host

          # Wait for initialization to complete
          Start-Sleep -Seconds 10

          Write-Host "WSL installation completed successfully"

      - name: Set up Ubuntu in WSL2
        shell: powershell
        run: |
          Write-Host "Setting up Ubuntu..."

          # Set error action to continue
          $ErrorActionPreference = 'Continue'

          # Set WSL2 as default version
          Write-Host "Setting WSL2 as default version..."
          wsl --set-default-version 2

          # Wait for Ubuntu to be ready
          Write-Host "Waiting for Ubuntu to initialize..."
          Start-Sleep -Seconds 10

          # Verify Ubuntu is installed
          Write-Host "Verifying Ubuntu installation..."
          wsl --list --verbose

          # Initialize Ubuntu with default user (check if user exists first)
          Write-Host "Creating testuser in Ubuntu..."
          wsl -d Ubuntu -u root bash -c "id testuser 2>/dev/null || (useradd -m -s /bin/bash testuser && echo 'testuser:testpass' | chpasswd && usermod -aG sudo testuser)"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Failed to create user in Ubuntu"
            Write-Host "Checking Ubuntu status..."
            wsl -d Ubuntu -u root bash -c "echo 'Ubuntu is accessible'"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Error: Cannot access Ubuntu in WSL"
              exit 1
            }
          }

          Write-Host "Configuring sudo for testuser..."
          wsl -d Ubuntu -u root bash -c "grep -q '%sudo ALL=(ALL) NOPASSWD:ALL' /etc/sudoers || echo '%sudo ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers"

          # Set default user (ubuntu command might not be available)
          Write-Host "Setting default user..."
          ubuntu config --default-user testuser 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Note: ubuntu config command not available, will use -u flag with wsl"
          }

          Write-Host "WSL2 Ubuntu setup complete"
          Write-Host "Final verification..."
          wsl --list --verbose
          wsl -d Ubuntu -u testuser bash -c "whoami"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: User verification failed"
            exit 1
          }

          Write-Host "[OK] Ubuntu setup completed successfully"

      - name: Test Docker installation in WSL2
        shell: powershell
        run: |
          Write-Host "Testing Docker installation..."

          cd cli

          # Note: The actual Docker installation will be triggered by the CLI
          # For now, we'll verify the WSL environment is ready
          wsl -d Ubuntu bash -c "echo 'WSL2 is ready for Docker installation'"

      - name: Verify WSL2 Docker socket access
        shell: powershell
        run: |
          Write-Host "Verifying Docker can be installed..."
          wsl -d Ubuntu bash -c "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | head -5"

      - name: Test CLI build and basic commands
        shell: powershell
        run: |
          cd cli
          Write-Host "Testing CLI version..."
          .\openframe.exe --version
          if ($LASTEXITCODE -ne 0) {
            .\openframe.exe version
            if ($LASTEXITCODE -ne 0) { Write-Host "No version command" }
          }

          Write-Host "Testing CLI help..."
          .\openframe.exe --help

      - name: Upload Windows binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openframe-windows-amd64
          path: cli/openframe.exe
          retention-days: 30

      - name: Test results summary
        if: always()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Windows CLI Test Summary"
          Write-Host "========================================"
          Write-Host "[OK] CLI binary built successfully"
          Write-Host "[OK] WSL2 installation verified"
          Write-Host "[OK] Ubuntu in WSL2 configured"
          Write-Host "[OK] Ready for Docker/kubectl/k3d installation"
          Write-Host ""
          Write-Host "Next steps for manual testing:"
          Write-Host "1. Download the artifact 'openframe-windows-amd64'"
          Write-Host "2. Run: .\openframe.exe cluster up"
          Write-Host "3. Verify Docker, kubectl, and k3d are installed"

  # Integration test - full installation flow
  test-windows-cli-installation:
    name: Test Full Installation on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        shell: bash
        run: |
          cd cli
          go build -o openframe.exe .

      - name: Install WSL2 and configure
        shell: powershell
        run: |
          # Set error action to continue
          $ErrorActionPreference = 'Continue'

          # Install WSL2 with Ubuntu (non-interactive)
          Write-Host "Installing WSL2 with Ubuntu..."
          echo Y | wsl --install -d Ubuntu --no-launch

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Warning: WSL installation returned exit code $LASTEXITCODE"
            Write-Host "This may be expected on some systems. Continuing..."
          }

          # Wait for installation
          Write-Host "Waiting for installation to complete..."
          Start-Sleep -Seconds 20

          # Set WSL2 as default
          Write-Host "Setting WSL2 as default version..."
          wsl --set-default-version 2

          # Verify installation
          Write-Host "Verifying WSL installation..."
          wsl --list --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: WSL verification failed"
            exit 1
          }

          # Initialize Ubuntu by running a simple command (this triggers first-time setup)
          Write-Host "Initializing Ubuntu (first launch)..."
          wsl -d Ubuntu -u root bash -c "echo 'Ubuntu initialized'" 2>&1 | Out-Host

          # Wait for Ubuntu to be ready
          Write-Host "Waiting for Ubuntu to initialize..."
          Start-Sleep -Seconds 10

          # Configure Ubuntu with runner user
          Write-Host "Configuring Ubuntu user..."
          wsl -d Ubuntu -u root bash -c "id runner 2>/dev/null || (useradd -m -s /bin/bash runner && echo 'runner:runner' | chpasswd && usermod -aG sudo runner)"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Failed to create user"
            exit 1
          }

          wsl -d Ubuntu -u root bash -c "grep -q '%sudo ALL=(ALL) NOPASSWD:ALL' /etc/sudoers || echo '%sudo ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers"

          # Verify user was created
          Write-Host "Verifying user creation..."
          wsl -d Ubuntu -u runner bash -c "whoami"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: User verification failed"
            exit 1
          }

          Write-Host "[OK] WSL2 and Ubuntu configured successfully"

      - name: Install Docker in WSL2 manually (for testing)
        shell: powershell
        run: |
          Write-Host "Installing Docker in WSL2..."

          # Check Ubuntu version
          wsl -d Ubuntu bash -c "lsb_release -a"

          # Update packages and install dependencies
          Write-Host "Step 1: Updating package lists..."
          wsl -d Ubuntu bash -c "sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq"

          Write-Host "Step 2: Installing prerequisites..."
          wsl -d Ubuntu bash -c "sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apt-transport-https ca-certificates curl gnupg lsb-release software-properties-common"

          # Remove any existing Docker GPG key
          Write-Host "Step 3: Cleaning up old Docker keys..."
          wsl -d Ubuntu bash -c "sudo rm -f /etc/apt/keyrings/docker.gpg /usr/share/keyrings/docker-archive-keyring.gpg"

          # Add Docker's official GPG key using the new method
          Write-Host "Step 4: Creating keyrings directory..."
          wsl -d Ubuntu bash -c "sudo install -m 0755 -d /etc/apt/keyrings"

          Write-Host "Step 5: Adding Docker GPG key..."
          wsl -d Ubuntu bash -c "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg"
          wsl -d Ubuntu bash -c "sudo chmod a+r /etc/apt/keyrings/docker.gpg"

          # Verify GPG key was added
          wsl -d Ubuntu bash -c "ls -la /etc/apt/keyrings/docker.gpg"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Docker GPG key was not created"
            exit 1
          }

          # Add Docker repository - using a reliable single command approach
          Write-Host "Step 6: Adding Docker repository..."

          # Build the repository line directly in one command with proper quoting
          wsl -d Ubuntu bash -c "echo \`"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\`" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null"

          # Verify repository was added
          Write-Host "Step 7: Verifying repository configuration..."
          wsl -d Ubuntu bash -c "cat /etc/apt/sources.list.d/docker.list"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Docker repository file was not created"
            exit 1
          }

          # Update package index with new repository
          Write-Host "Step 8: Updating package index with Docker repository..."
          wsl -d Ubuntu bash -c "sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq"

          # Check if Docker packages are available
          Write-Host "Step 9: Checking Docker package availability..."
          wsl -d Ubuntu bash -c "apt-cache policy docker-ce"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Docker packages are not available"
            exit 1
          }

          # Install Docker
          Write-Host "Step 10: Installing Docker packages..."
          wsl -d Ubuntu bash -c "sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Docker installation failed"
            exit 1
          }

          # Configure Docker service for WSL2
          Write-Host "Step 11: Configuring Docker for WSL2..."
          wsl -d Ubuntu bash -c "sudo mkdir -p /var/run"

          # Start Docker daemon in background
          Write-Host "Step 12: Starting Docker daemon..."
          wsl -d Ubuntu bash -c "sudo dockerd > /tmp/dockerd.log 2>&1 &"

          # Wait for Docker to be ready
          Write-Host "Waiting for Docker daemon to start..."
          Start-Sleep -Seconds 10

          # Verify Docker installation
          Write-Host "Step 13: Verifying Docker installation..."
          wsl -d Ubuntu bash -c "sudo docker --version"
          wsl -d Ubuntu bash -c "sudo docker info || sudo docker ps"

      - name: Test Docker from Windows
        shell: powershell
        run: |
          Write-Host "Testing Docker access from Windows..."
          wsl -d Ubuntu -u runner bash -c "sudo docker ps"
          wsl -d Ubuntu -u runner bash -c "sudo docker version"

      - name: Install kubectl in WSL2
        shell: powershell
        run: |
          Write-Host "Installing kubectl..."
          wsl -d Ubuntu -u runner bash -c 'curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl && rm kubectl'
          wsl -d Ubuntu -u runner kubectl version --client

      - name: Install k3d in WSL2
        shell: powershell
        run: |
          Write-Host "Installing k3d..."
          wsl -d Ubuntu -u runner bash -c 'curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash'
          wsl -d Ubuntu -u runner k3d version

      - name: Test k3d cluster creation
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          Write-Host "Testing k3d cluster creation..."
          wsl -d Ubuntu -u runner bash -c "sudo k3d cluster create test-cluster --wait --timeout 300s"
          wsl -d Ubuntu -u runner kubectl get nodes
          wsl -d Ubuntu -u runner bash -c "sudo k3d cluster delete test-cluster"

      - name: Installation test summary
        if: always()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Full Installation Test Results"
          Write-Host "========================================"

          # Check if Ubuntu distribution exists before running commands
          $distroExists = $false
          try {
            wsl --list --verbose 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $distroExists = $true
            }
          } catch {
            Write-Host "Warning: Could not verify WSL distributions"
          }

          if ($distroExists) {
            wsl -d Ubuntu -u runner bash -c 'echo "Docker: $(sudo docker --version 2>/dev/null || echo FAILED)"' 2>&1 | Out-Host
            wsl -d Ubuntu -u runner bash -c 'echo "kubectl: $(kubectl version --client --short 2>/dev/null || echo FAILED)"' 2>&1 | Out-Host
            wsl -d Ubuntu -u runner bash -c 'echo "k3d: $(k3d version 2>/dev/null || echo FAILED)"' 2>&1 | Out-Host
          } else {
            Write-Host "Docker: FAILED (WSL distribution not found)"
            Write-Host "kubectl: FAILED (WSL distribution not found)"
            Write-Host "k3d: FAILED (WSL distribution not found)"
            exit 1
          }

  # Comment on PR with results
  comment-results:
    name: Comment Test Results
    runs-on: ubuntu-latest
    needs: [test-windows-cli, test-windows-cli-installation]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ needs.test-windows-cli.result }}';
            const installStatus = '${{ needs.test-windows-cli-installation.result }}';

            const buildIcon = buildStatus === 'success' ? ':white_check_mark:' : ':x:';
            const installIcon = installStatus === 'success' ? ':white_check_mark:' : ':x:';

            const comment = `## Windows CLI Test Results

            ${buildIcon} **Build Test**: ${buildStatus}
            ${installIcon} **Installation Test**: ${installStatus}

            ### Summary
            - Windows binary compilation: ${buildIcon}
            - WSL2 setup: ${buildStatus === 'success' ? ':white_check_mark:' : ':x:'}
            - Docker installation: ${installIcon}
            - kubectl installation: ${installIcon}
            - k3d installation: ${installIcon}

            ${buildStatus === 'success' ? ':white_check_mark: Windows CLI binary is available as an artifact!' : ':x: Build failed, please check logs'}

            <details>
            <summary>View workflow run</summary>

            [View full test results](${context.payload.repository.html_url}/actions/runs/${context.runId})
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
