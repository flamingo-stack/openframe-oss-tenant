name: Test Windows CLI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/test-windows-cli.yml'
  push:
    branches: [main, feat/windows-cli]
    paths:
      - 'cli/**'
  workflow_dispatch:

jobs:
  test-windows-cli:
    name: Test CLI on Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: cli/go.sum

      - name: Build Windows CLI binary
        shell: bash
        run: |
          cd cli
          go build -v -o openframe.exe .
          ls -lh openframe.exe

      - name: Check WSL2 status
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Checking WSL status..."
          wsl --status 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "WSL not fully configured yet" }
          wsl --list --verbose 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "No WSL distributions installed" }
          exit 0  # Ensure step exits successfully

      - name: Install WSL2 and Ubuntu
        shell: powershell
        run: |
          Write-Host "Installing WSL2 and Ubuntu..."

          # Set error action to continue
          $ErrorActionPreference = 'Continue'

          # Install WSL with Ubuntu in one command, with yes to all prompts
          Write-Host "Running: wsl --install -d Ubuntu --no-launch"
          echo Y | wsl --install -d Ubuntu --no-launch

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Warning: WSL installation returned exit code $LASTEXITCODE"
            Write-Host "This is expected on some systems. Continuing..."
          }

          # Wait for installation to complete
          Write-Host "Waiting for installation to complete..."
          Start-Sleep -Seconds 20

          # Check status
          Write-Host "Checking WSL status after installation..."
          wsl --status
          wsl --list --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: WSL installation may have failed"
            Write-Host "Attempting to verify WSL availability..."
            wsl --help
            exit 1
          }

          # Initialize Ubuntu by running a simple command (this triggers first-time setup)
          Write-Host "Initializing Ubuntu (first launch)..."
          wsl -d Ubuntu -u root bash -c "echo 'Ubuntu initialized'" 2>&1 | Out-Host

          # Wait for initialization to complete
          Start-Sleep -Seconds 10

          Write-Host "WSL installation completed successfully"

      - name: Set up Ubuntu in WSL2
        shell: powershell
        run: |
          Write-Host "Setting up Ubuntu..."

          # Set error action to continue
          $ErrorActionPreference = 'Continue'

          # Set WSL2 as default version
          Write-Host "Setting WSL2 as default version..."
          wsl --set-default-version 2

          # Wait for Ubuntu to be ready
          Write-Host "Waiting for Ubuntu to initialize..."
          Start-Sleep -Seconds 10

          # Verify Ubuntu is installed
          Write-Host "Verifying Ubuntu installation..."
          wsl --list --verbose

          # Initialize Ubuntu with default user (check if user exists first)
          Write-Host "Creating testuser in Ubuntu..."
          wsl -d Ubuntu -u root bash -c "id testuser 2>/dev/null || (useradd -m -s /bin/bash testuser && echo 'testuser:testpass' | chpasswd && usermod -aG sudo testuser)"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Failed to create user in Ubuntu"
            Write-Host "Checking Ubuntu status..."
            wsl -d Ubuntu -u root bash -c "echo 'Ubuntu is accessible'"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Error: Cannot access Ubuntu in WSL"
              exit 1
            }
          }

          Write-Host "Configuring sudo for testuser..."
          wsl -d Ubuntu -u root bash -c "grep -q '%sudo ALL=(ALL) NOPASSWD:ALL' /etc/sudoers || echo '%sudo ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers"

          # Set default user (ubuntu command might not be available)
          Write-Host "Setting default user..."
          ubuntu config --default-user testuser 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Note: ubuntu config command not available, will use -u flag with wsl"
          }

          Write-Host "WSL2 Ubuntu setup complete"
          Write-Host "Final verification..."
          wsl --list --verbose
          wsl -d Ubuntu -u testuser bash -c "whoami"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: User verification failed"
            exit 1
          }

          Write-Host "[OK] Ubuntu setup completed successfully"

      - name: Test prerequisite check (should detect missing tools)
        shell: powershell
        continue-on-error: true
        run: |
          cd cli
          Write-Host "Testing prerequisite checker..."
          # Use cluster list to trigger prerequisite check (CI env var is set automatically by GitHub Actions)
          .\openframe.exe cluster list 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "Prerequisites check completed (missing tools detected as expected)" }
          exit 0  # Ensure step exits successfully

      - name: Test Docker installation in WSL2
        shell: powershell
        run: |
          Write-Host "Testing Docker installation..."

          cd cli

          # Note: The actual Docker installation will be triggered by the CLI
          # For now, we'll verify the WSL environment is ready
          wsl -d Ubuntu bash -c "echo 'WSL2 is ready for Docker installation'"

      - name: Verify WSL2 Docker socket access
        shell: powershell
        run: |
          Write-Host "Verifying Docker can be installed..."
          wsl -d Ubuntu bash -c "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | head -5"

      - name: Test CLI build and basic commands
        shell: powershell
        run: |
          cd cli
          Write-Host "Testing CLI version..."
          .\openframe.exe --version
          if ($LASTEXITCODE -ne 0) {
            .\openframe.exe version
            if ($LASTEXITCODE -ne 0) { Write-Host "No version command" }
          }

          Write-Host "Testing CLI help..."
          .\openframe.exe --help

      - name: Upload Windows binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openframe-windows-amd64
          path: cli/openframe.exe
          retention-days: 30

      - name: Test results summary
        if: always()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Windows CLI Test Summary"
          Write-Host "========================================"
          Write-Host "[OK] CLI binary built successfully"
          Write-Host "[OK] WSL2 installation verified"
          Write-Host "[OK] Ubuntu in WSL2 configured"
          Write-Host "[OK] Ready for Docker/kubectl/k3d installation"
          Write-Host ""
          Write-Host "Next steps for manual testing:"
          Write-Host "1. Download the artifact 'openframe-windows-amd64'"
          Write-Host "2. Run: .\openframe.exe cluster up"
          Write-Host "3. Verify Docker, kubectl, and k3d are installed"

  # Integration test - full installation flow
  test-windows-cli-installation:
    name: Test Full Installation on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        shell: bash
        run: |
          cd cli
          go build -o openframe.exe .

      - name: Install WSL2 and configure
        shell: powershell
        run: |
          # Set error action to continue
          $ErrorActionPreference = 'Continue'

          # Install WSL2 with Ubuntu (non-interactive)
          Write-Host "Installing WSL2 with Ubuntu..."
          echo Y | wsl --install -d Ubuntu --no-launch

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Warning: WSL installation returned exit code $LASTEXITCODE"
            Write-Host "This may be expected on some systems. Continuing..."
          }

          # Wait for installation
          Write-Host "Waiting for installation to complete..."
          Start-Sleep -Seconds 20

          # Set WSL2 as default
          Write-Host "Setting WSL2 as default version..."
          wsl --set-default-version 2

          # Verify installation
          Write-Host "Verifying WSL installation..."
          wsl --list --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: WSL verification failed"
            exit 1
          }

          # Initialize Ubuntu by running a simple command (this triggers first-time setup)
          Write-Host "Initializing Ubuntu (first launch)..."
          wsl -d Ubuntu -u root bash -c "echo 'Ubuntu initialized'" 2>&1 | Out-Host

          # Wait for Ubuntu to be ready
          Write-Host "Waiting for Ubuntu to initialize..."
          Start-Sleep -Seconds 10

          # Configure Ubuntu with runner user
          Write-Host "Configuring Ubuntu user..."
          wsl -d Ubuntu -u root bash -c "id runner 2>/dev/null || (useradd -m -s /bin/bash runner && echo 'runner:runner' | chpasswd && usermod -aG sudo runner)"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Failed to create user"
            exit 1
          }

          wsl -d Ubuntu -u root bash -c "grep -q '%sudo ALL=(ALL) NOPASSWD:ALL' /etc/sudoers || echo '%sudo ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers"

          # Verify user was created
          Write-Host "Verifying user creation..."
          wsl -d Ubuntu -u runner bash -c "whoami"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: User verification failed"
            exit 1
          }

          Write-Host "[OK] WSL2 and Ubuntu configured successfully"

      - name: Install Docker in WSL2 using CLI script
        shell: powershell
        run: |
          Write-Host "Installing Docker in WSL2 using installation script..."

          # Create installation script content
          $installScript = @'
          #!/bin/bash
          set -e

          # Check if docker is already installed
          if command -v docker &> /dev/null; then
              echo "Docker already installed in WSL2"
              exit 0
          fi

          echo "Installing Docker CE..."

          # Update package index
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq

          # Install prerequisites
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apt-transport-https ca-certificates curl gnupg lsb-release software-properties-common

          # Add Docker's official GPG key
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg

          # Add Docker repository
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          # Install Docker CE
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          # Add current user to docker group
          sudo usermod -aG docker $USER

          echo "Docker CE installed successfully"
'@

          # Write script to WSL
          Write-Host "Copying installation script to WSL..."
          $installScript | wsl.exe -d Ubuntu bash -c "cat > /tmp/install-docker.sh"

          # Execute installation script
          Write-Host "Running Docker installation..."
          wsl.exe -d Ubuntu bash /tmp/install-docker.sh

          Write-Host "Configuring Docker daemon..."

          # Configure Docker
          $configureScript = @'
          #!/bin/bash
          set -e

          # Configure Docker to listen on unix socket
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json > /dev/null <<EOF
          {
            "iptables": false
          }
          EOF

          # Create a script to start Docker daemon
          sudo tee /usr/local/bin/start-docker.sh > /dev/null <<'INNER_SCRIPT'
          #!/bin/bash
          if ! pgrep -x dockerd > /dev/null; then
              sudo dockerd > /dev/null 2>&1 &
          fi
          INNER_SCRIPT

          sudo chmod +x /usr/local/bin/start-docker.sh

          # Start Docker now
          sudo /usr/local/bin/start-docker.sh

          # Wait for Docker to be ready
          for i in {1..30}; do
              if sudo docker ps > /dev/null 2>&1; then
                  echo "Docker is running"
                  break
              fi
              sleep 1
          done

          echo "Docker configured successfully"
'@

          # Write and execute configuration script
          Write-Host "Copying configuration script to WSL..."
          $configureScript | wsl.exe -d Ubuntu bash -c "cat > /tmp/configure-docker.sh"

          Write-Host "Running Docker configuration..."
          wsl.exe -d Ubuntu bash /tmp/configure-docker.sh

          Write-Host "[OK] Docker installation completed successfully"

      - name: Test Docker from Windows
        shell: powershell
        run: |
          Write-Host "Testing Docker access from Windows..."

          # Test with sudo (should work immediately)
          Write-Host "Testing Docker with sudo..."
          wsl.exe -d Ubuntu -u runner bash -c "sudo docker --version"
          wsl.exe -d Ubuntu -u runner bash -c "sudo docker ps"

          Write-Host "[OK] Docker is accessible with sudo"

      - name: Install kubectl in WSL2
        shell: powershell
        run: |
          Write-Host "Installing kubectl..."
          wsl.exe -d Ubuntu -u runner bash -c 'curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl && rm kubectl'
          wsl.exe -d Ubuntu -u runner kubectl version --client

          Write-Host "[OK] kubectl installed successfully"

      - name: Install k3d in WSL2
        shell: powershell
        run: |
          Write-Host "Installing k3d..."
          wsl.exe -d Ubuntu -u runner bash -c 'curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash'
          wsl.exe -d Ubuntu -u runner k3d version

          Write-Host "[OK] k3d installed successfully"

      - name: Test k3d cluster creation
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          Write-Host "Testing k3d cluster creation..."
          wsl.exe -d Ubuntu -u runner bash -c "sudo k3d cluster create test-cluster --wait --timeout 300s"

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cluster created successfully. Checking nodes..."
            wsl.exe -d Ubuntu -u runner kubectl get nodes

            Write-Host "Deleting test cluster..."
            wsl.exe -d Ubuntu -u runner bash -c "sudo k3d cluster delete test-cluster"

            Write-Host "[OK] k3d cluster creation test passed"
          } else {
            Write-Host "[WARNING] k3d cluster creation failed (this is acceptable in CI)"
          }

      - name: Installation test summary
        if: always()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Full Installation Test Results"
          Write-Host "========================================"

          # Check if Ubuntu distribution exists
          wsl.exe --list --verbose 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host ""
            Write-Host "Tool Versions:"
            Write-Host "=============="

            # Check Docker
            $docker_version = wsl.exe -d Ubuntu -u runner bash -c 'sudo docker --version 2>/dev/null'
            if ($LASTEXITCODE -ne 0) { $docker_version = "FAILED" }
            Write-Host "Docker: $docker_version"

            # Check kubectl
            $kubectl_version = wsl.exe -d Ubuntu -u runner bash -c 'kubectl version --client --short 2>/dev/null'
            if ($LASTEXITCODE -ne 0) { $kubectl_version = "FAILED" }
            Write-Host "kubectl: $kubectl_version"

            # Check k3d
            $k3d_version = wsl.exe -d Ubuntu -u runner bash -c 'k3d version 2>/dev/null'
            if ($LASTEXITCODE -ne 0) { $k3d_version = "FAILED" }
            Write-Host "k3d: $k3d_version"

            Write-Host ""
            Write-Host "========================================"
            Write-Host "[OK] Installation test completed"
            Write-Host "========================================"
          } else {
            Write-Host "ERROR: WSL distribution not found"
            Write-Host "Docker: FAILED (WSL not available)"
            Write-Host "kubectl: FAILED (WSL not available)"
            Write-Host "k3d: FAILED (WSL not available)"
            exit 1
          }

  # Comment on PR with results
  comment-results:
    name: Comment Test Results
    runs-on: ubuntu-latest
    needs: [test-windows-cli, test-windows-cli-installation]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ needs.test-windows-cli.result }}';
            const installStatus = '${{ needs.test-windows-cli-installation.result }}';

            const buildIcon = buildStatus === 'success' ? ':white_check_mark:' : ':x:';
            const installIcon = installStatus === 'success' ? ':white_check_mark:' : ':x:';

            const comment = `## Windows CLI Test Results

            ${buildIcon} **Build Test**: ${buildStatus}
            ${installIcon} **Installation Test**: ${installStatus}

            ### Summary
            - Windows binary compilation: ${buildIcon}
            - WSL2 setup: ${buildStatus === 'success' ? ':white_check_mark:' : ':x:'}
            - Docker installation: ${installIcon}
            - kubectl installation: ${installIcon}
            - k3d installation: ${installIcon}

            ${buildStatus === 'success' ? ':white_check_mark: Windows CLI binary is available as an artifact!' : ':x: Build failed, please check logs'}

            <details>
            <summary>View workflow run</summary>

            [View full test results](${context.payload.repository.html_url}/actions/runs/${context.runId})
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
