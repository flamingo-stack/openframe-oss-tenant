name: E2E Tests - Scheduled

# =============================================================================
# WORKFLOW CONFIGURATION
# =============================================================================

permissions:
  contents: read
  packages: read
  actions: write
  pages: write
  id-token: write

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - ui
          - integration
          - e2e

env:
  REGISTRY: "ghcr.io"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}
  HELM_VALUES_FILE: "scripts/helm-values.yaml"

# =============================================================================
# JOBS
# =============================================================================

jobs:
  setup-cluster:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      cluster-ready: ${{ steps.cluster-status.outputs.ready }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install tools and validate environment
        uses: ./.github/steps/requirements-for-run.sh

      - name: Setup cluster and deploy services
        env:
          TERM: dumb
        run: |
          echo "Starting OpenFrame cluster bootstrap..."
          ./scripts/run.sh bootstrap

      - name: Wait for all services to be healthy
        id: cluster-status
        run: |
          echo "⏳ Waiting for all ArgoCD applications to be healthy..."
          
          # Wait up to 30 minutes for all services
          timeout 1800 bash -c '
            while true; do
              # Get unhealthy apps
              UNHEALTHY=$(kubectl -n argocd get apps -o jsonpath="{.items[?(@.status.health.status!='\''Healthy'\'' || @.status.sync.status!='\''Synced'\'')].metadata.name}")
              
              if [ -z "$UNHEALTHY" ]; then
                echo "All services are healthy!"
                kubectl -n argocd get apps
                break
              else
                echo "⏳ Waiting for services: $UNHEALTHY"
                sleep 30
              fi
            done
          '
          
          echo "ready=true" >> $GITHUB_OUTPUT

      - name: Verify service endpoints
        run: |
          kubectl get pods -A | grep -E "(openframe|tactical|fleet|mesh|authentik)" | head -20
          kubectl -n argocd get apps -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status

  run-e2e-tests:
    name: Run E2E Test Suite
    runs-on: ubuntu-latest
    needs: setup-cluster
    timeout-minutes: 60
    if: needs.setup-cluster.outputs.cluster-ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: [rest-api, integration, e2e-pipeline, ui]
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Allure
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -xzf allure-2.25.0.tgz
          sudo mv allure-2.25.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Install tools for cluster access
        uses: ./.github/steps/requirements-for-run.sh

      - name: Run E2E Tests
        working-directory: openframe/openframe-e2e-tests
        run: |
          case "${{ matrix.test-type }}" in
            rest-api)
              mvn test \
                -Dtest="**/restapi/**Test" \
                -Dallure.results.directory=target/allure-results-api \
                -Dmaven.test.failure.ignore=true
              ;;
            integration)
              mvn test \
                -Dtest="**/integration/**IT" \
                -Dallure.results.directory=target/allure-results-integration \
                -Dmaven.test.failure.ignore=true
              ;;
            e2e-pipeline)
              mvn test \
                -Dtest="**/e2e/**E2ETest" \
                -Dallure.results.directory=target/allure-results-e2e \
                -Dmaven.test.failure.ignore=true
              ;;
            ui)
              mvn test \
                -Dtest="**/ui/**Test" \
                -Dallure.results.directory=target/allure-results-ui \
                -Dmaven.test.failure.ignore=true
              ;;
          esac

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-type }}
          path: |
            openframe/openframe-e2e-tests/target/allure-results-*
            openframe/openframe-e2e-tests/target/surefire-reports
          retention-days: 7

  generate-allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: run-e2e-tests
    if: always()
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Allure
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -xzf allure-2.25.0.tgz
          sudo mv allure-2.25.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report
          echo "Report generated: $(date)" > allure-report/timestamp.txt

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: e2e-reports/${{ github.run_number }}
          keep_files: true


      - name: Comment with report links
        if: always()
        run: |
          echo "📊 **E2E Test Report Generated**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Links:**" >> $GITHUB_STEP_SUMMARY
          echo "- [📈 Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/e2e-reports/${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: 🧹 Cleanup Resources
    runs-on: ubuntu-latest
    needs: [setup-cluster, run-e2e-tests, generate-allure-report]
    if: always()
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install cleanup tools
        uses: ./.github/steps/requirements-for-run.sh

      - name: Cleanup cluster and resources
        run: |
          ./scripts/run.sh delete || true
          docker system prune -f || true
          docker network prune -f || true

      - name: Final status
        if: always()
        run: |
          echo "🎯 **E2E Test Pipeline Completed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Duration:** Approximately ${{ github.event.created_at }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Check the Allure reports for detailed test results!" >> $GITHUB_STEP_SUMMARY
