name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'openframe/**'
      - 'integrated-tools/**'
      - 'pom.xml'
      - 'clients/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: "ghcr.io"
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  matrix:
    uses: ./.github/workflows/matrix.yml

  build_images:
    name: "Build: ${{ matrix.name }}"
    needs: [changes, matrix]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs[matrix.id] == 'true'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.images_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          echo "Building ${{ matrix.name }}..."
          # Add your Docker build and push logic here

  build_clients:
    name: "Build Rust Client: ${{ matrix.name }} on ${{ matrix.os }}"
    needs: [changes, matrix]
    runs-on: "${{ matrix.os }}-latest"
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.client == 'true' ||
      needs.changes.outputs.openframe-chat == 'true'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.clients_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/steps/rust-setup
        with:
          path: ${{ matrix.path }}
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build client
        working-directory: ${{ matrix.path }}
        run: |
          make release

  release:
    name: "Create Release"
    needs: [changes, matrix, build_images, build_clients]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: "Release ${{ github.event.inputs.version }}"
          draft: false
          prerelease: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
