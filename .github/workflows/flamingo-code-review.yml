# Generated by the Flamingo hub — do not edit by hand.
# Per-repo settings live in the hub admin (/admin/code-review); this file is
# byte-identical across every reviewed repository AND every deployment, which
# is what makes drift detectable by comparison. The hub's address arrives in
# the dispatch payload (doc-orchestrator style) or, for pull_request runs, the
# org Actions variable FLAMINGO_HUB_BASE_URL.
# Named like its sibling pipeline ('🦩 Flamingo Code Documentation') so both
# read as one product family in the Actions sidebar.
name: 🦩 Flamingo Code Review

on:
  # Push trigger - registers workflow with GitHub Actions (required for
  # workflow_dispatch API). Only fires when this file itself changes; the job
  # skips it — same pattern as the doc-orchestrator workflow.
  push:
    paths:
      - '.github/workflows/flamingo-code-review.yml'

  # ENTERS-REVIEW ONLY (2026-08-12; corrected 2026-09-07). The automatic
  # triggers are the moments a pull request ENTERS review, and nothing else.
  #
  # 'synchronize' (per-push) stays deliberately OFF. Reviewing every commit on
  # an open PR is the largest avoidable cost in an AI review pipeline, and it
  # trains authors to tune the bot out; the 2026 industry default is to review
  # at review moments and offer an explicit re-review on demand.
  #
  # 'opened' and 'reopened' were OFF between 2026-08-15 and 2026-09-07, on the
  # assumption that PRs are opened as drafts and later promoted. They are not
  # — PRs here are born non-draft, GitHub NEVER fires ready_for_review for
  # those, and so the automatic review effectively never ran. Drafts stay
  # excluded: an 'opened' event for a draft is dropped by the job's
  # draft == false guard, and that PR is reviewed later, on its
  # ready_for_review.
  #
  # 'labeled' is the on-demand re-review — the affordance that makes the
  # no-per-push default liveable. Commits pushed AFTER the first review are not
  # auto-reviewed, so adding the flamingo-review label is how a human
  # asks for another pass. A SEPARATE job removes it the moment the event
  # arrives, so adding it again asks again, and it can never strand itself on a
  # pull request the review gate declines. Every other label name is dropped by
  # the job's if — a skipped run, zero billable minutes.
  #
  # A 'synchronize' carrying that label is treated as the same request. GitHub
  # runs the workflow from the pull request's HEAD, so a label applied to a
  # branch whose head predates this file fires an event no workflow was there
  # to handle: the label lands, nothing runs, nothing consumes it, and because
  # it is now already present, adding it again fires NOTHING AT ALL. Honouring
  # it on the next push is what breaks that stall — the request gets served
  # once and consumed, instead of sitting on the pull request looking applied.
  #
  # 'synchronize' (every push) is otherwise here ONLY to serve the
  # flamingo-review-always label, and the job's if drops it on every pull
  # request that does not carry it. That is the per-PR escalation: subscribe the
  # risky refactor to continuous review, leave everything else on one review per
  # pull request. A skipped push run costs no billable minutes.
  #
  # Every repeat pass diffs only the delta since the last reviewed head — see
  # the incremental anchor in code-review-review.mjs.
  pull_request:
    types: [opened, ready_for_review, reopened, labeled, synchronize]

  # THE PRIMARY MANUAL TRIGGER (2026-09-08). A new top-level pull-request
  # comment beginning with '@flamingo-review' asks for another pass;
  # '@flamingo-review full' additionally overrules the incremental anchor
  # and re-reads the whole cumulative diff.
  #
  # This exists because the label could not TEACH ITSELF. The summary comment
  # is the only surface an author reliably sees, a comment cannot link to or
  # explain a sidebar label, and so the once-per-PR default read as "the bot
  # only reviewed my first commit". A command can be printed in the very
  # comment that prompts the question — see the footer in code-review-post.mjs.
  # It is also where the market landed: CodeRabbit ('@coderabbitai review' /
  # 'full review') and Cursor Bugbot ('cursor review' / 'bugbot run') both take
  # a new top-level comment, and both split incremental from full.
  #
  # 'edited' is the CHECKBOX lane — the closest thing a GitHub comment has to a
  # button, and the same mechanism CodeRabbit uses for its clickable actions.
  # Checking a task-list box in the summary comment edits that comment, which
  # fires issue_comment.edited; the boxes are the two commands, clickable.
  #
  # Its costs are real and accepted, not overlooked: 'edited' fires on EVERY
  # comment edit in the repository, so an unrelated typo fix evaluates this
  # workflow and skips (zero billable minutes, but a skipped run in the Actions
  # list — the same trade already made for push and synchronize). And a
  # checkbox is STATE, so resolve_command unchecks it after consuming, which is
  # what lets it be clicked again.
  #
  # WRITE ACCESS IS ENFORCED BY GITHUB HERE, not by us: only a user with write
  # permission can toggle a task list in someone else's comment, so the
  # author_association gate that gutters the 'created' lane has no equivalent —
  # and needs none. What IS checked is that the edited comment is the bot's own
  # summary and that a human did the editing, so the uncheck below cannot
  # re-trigger the workflow it just served.
  #
  # issue_comment fires only for top-level comments; a reply inside a review
  # thread is pull_request_review_comment and is NOT a trigger here (the same
  # boundary Bugbot documents). Review-thread replies stay conversation.
  #
  # SECURITY, and the reason for the resolve_command job below: unlike a
  # pull_request run, an issue_comment run executes in the BASE repository with
  # a WRITE token and full secrets. The event carries no head SHA and no head
  # repository, so 'is this a fork?' cannot be answered in a job 'if' — and
  # checking out refs/pull/N/head without answering it would run this workflow
  # over fork-authored code holding that token. resolve_command answers it via
  # the API BEFORE anything is checked out, and forks are refused there.
  issue_comment:
    types: [created, edited]

  repository_dispatch:
    types: [flamingo-code-review]
  # Lets the hub target a SETUP BRANCH before the install PR merges — the same
  # test-before-merge flow the doc pipeline uses. repository_dispatch only ever
  # fires on the default branch.
  workflow_dispatch:
    # ═══════════════════════════════════════════════════════════════════════════
    # GENERATED FROM SINGLE SOURCE OF TRUTH: CODE_REVIEW_PARAMS (this module)
    # This section is auto-generated when creating workflow PRs
    # ═══════════════════════════════════════════════════════════════════════════
    inputs:
      run_id:
        description: 'Hub run-record id binding this execution to a code_review_runs row. Empty for pull_request runs — the hub creates the row from the callback.'
        required: false
        default: ''
      run_token:
        description: 'Per-run token minted by the hub at dispatch. Binds the callback to THIS run — the org-wide secret alone would let any repo report against another repo’s run.'
        required: false
        default: ''
      mode:
        description: 'Review mode: pr (diff-scoped), sweep (whole-repo scanner) or mine (rule mining over the full checkout).'
        required: false
        default: 'sweep'
      hub_base_url:
        description: 'Absolute hub origin. Dispatches carry it doc-orchestrator style; pull_request runs fall back to the org/repo Actions variable FLAMINGO_HUB_BASE_URL (shipped by Sync Secrets).'
        required: false
        default: ''
      review_budget_chars:
        description: 'Sweep corpus budget in characters for this run (review_config.sweep_budget_chars). Empty = UNCAPPED — the whole eligible corpus is reviewed in ~80K batches. The local twin defaults to 80000 instead; set the per-repo value to cap CI spend.'
        required: false
        default: ''
    # ═══════════════════════════════════════════════════════════════════════════
    # END GENERATED SECTION
    # ═══════════════════════════════════════════════════════════════════════════

# GENERATED FROM SINGLE SOURCE OF TRUTH: CODE_REVIEW_PARAMS (this module)
# The doc-orchestrator's parameter chain for EVERY dispatch param: payload
# first, workflow_dispatch input second, then the param's runtime fallback.
# Workflow-level, so every dispatch var reaches every step and every
# downloaded script. SECURITY: only NON-SENSITIVE values live here — secrets
# are passed per-step, same as the doc workflow.
env:
  RUN_ID: ${{ github.event.client_payload.run_id || github.event.inputs.run_id || '' }}
  MODE: ${{ github.event.client_payload.mode || github.event.inputs.mode || ((github.event_name == 'pull_request' || github.event_name == 'issue_comment') && 'pr' || 'sweep') }}
  HUB_BASE_URL: ${{ github.event.client_payload.hub_base_url || github.event.inputs.hub_base_url || vars.FLAMINGO_HUB_BASE_URL }}
  REVIEW_BUDGET_CHARS: ${{ github.event.client_payload.review_budget_chars || github.event.inputs.review_budget_chars || '' }}

# Superseding a PR cancels the in-flight review of the stale head SHA; the
# fresh run reviews (and reports on) the new one. The always() report step
# still fires on the cancelled run, so its row records 'cancelled' rather
# than dangling.
concurrency:
  group: flamingo-code-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  # Cache SAVE needs it. With an explicit permissions block every unlisted
  # scope is 'none', so actions/cache could restore but not reserve a key and
  # every run ended with "Failed to save: ... cache write denied: token has no
  # writable scopes" — the corpus 304 path silently never worked.
  actions: write

jobs:
  # Consuming the label is its OWN job, gated on nothing but "that label was
  # added". Living inside the review job meant a label applied to a pull request the
  # review gate declines — a bot PR, a fork — was never consumed: the label sat
  # there permanently, and because it was already present, adding it again did
  # nothing. A silent dead end with no feedback. Split out, the request is
  # always consumed, whether or not a review follows it.
  #
  # It does NOT remove flamingo-review-always: that label is durable state
  # ("keep reviewing this PR"), not a one-shot request.
  consume-review-request:
    # The fork clause is not a token guard — a fork pull_request run gets a
    # READ-ONLY token whatever this file declares, so the DELETE below could
    # not succeed there even without it. It is here because a job that
    # provably cannot do its work should not start: on a fork the label
    # strands either way, and burning a runner to fail silently only hides
    # that. Same clause, same reason, as the review job below.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' &&
        github.event.label.name == 'flamingo-review') ||
       (github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'flamingo-review')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Consume the on-demand review label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Best-effort: losing this race must never fail anything.
        run: |
          CURL_CFG=$(mktemp) && chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN" > "$CURL_CFG"
          curl -sS --max-time 30 -K "$CURL_CFG" -X DELETE \
            "https://api.github.com/repos/$REPO_FULL/issues/$PR_NUMBER/labels/flamingo-review" > /dev/null || true
          rm -f "$CURL_CFG"

  # Resolves a COMMENT COMMAND into the pull-request context the review job
  # needs, and refuses the cases the job 'if' provably cannot judge.
  #
  # It exists because an issue_comment event is context-poor by design: it
  # carries the comment and the ISSUE, never the pull request. No head SHA, no
  # head repository, no draft flag, no author type. Everything the review job's
  # guard reads from github.event.pull_request.* is simply absent, and the two
  # facts that gate SAFETY — is this a fork, is the author a bot — can only be
  # answered by asking the API. A job 'if' cannot make an API call, so this job
  # is the 'if' that could not be written as one.
  #
  # Ordering is the point: nothing is checked out until after the fork answer.
  # An issue_comment run holds a WRITE token, so checking out refs/pull/N/head
  # first and asking afterwards would have already run this workflow over
  # fork-authored code with that token in scope.
  #
  # The cheap, event-local half of the gate stays in the 'if' below (a
  # command-shaped comment, on an open pull request, from someone with write
  # access) so an outsider's comment never starts a runner at all.
  #
  # 'github.event.issue.pull_request' is tested for TRUTHINESS, never against
  # null. Comparing an object to null in an Actions expression coerces both to
  # numbers, the object becomes NaN, and every NaN comparison is false — so the
  # null form would have refused every real pull request while looking correct.
  #
  # Underscored job id ON PURPOSE: 'needs.<id>' is a context path, and a hyphen
  # there parses as subtraction. A hyphenated id would need needs['...'] at
  # every one of the reads below, and the first person to add a plain one would
  # get a silently-empty value rather than an error.
  resolve_command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      ((github.event.action == 'created' &&
        startsWith(github.event.comment.body, '@flamingo-review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
       (github.event.action == 'edited' &&
        github.event.comment.user.type == 'Bot' &&
        github.event.sender.type != 'Bot' &&
        (contains(github.event.comment.body, '[x] Review the new commits') ||
         contains(github.event.comment.body, '[x] Review the whole diff again'))))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      # The review job reads ONLY 'proceed'. Every refusal is a false here plus
      # an explanation posted to the pull request — never a red run, because a
      # command this pipeline declines to serve is not a broken pipeline, and a
      # failed check on someone's PR for asking a question is noise.
      proceed: ${{ steps.resolve.outputs.proceed }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      full: ${{ steps.resolve.outputs.full }}
    steps:
      - name: Resolve the pull request behind the comment
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          # 'created' (a typed command) vs 'edited' (a checked box) — the two
          # lanes read the request from different places in the same body.
          EVENT_ACTION: ${{ github.event.action }}
          # Read as DATA, never interpolated into the script body: a comment is
          # attacker-authored text, and ${{ }}-ing it into 'run:' is the
          # canonical Actions script-injection sink. The full-pass test below is
          # a shell string comparison against this variable.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          CURL_CFG=$(mktemp) && chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN" > "$CURL_CFG"
          trap 'rm -f "$CURL_CFG"' EXIT

          # 'proceed' is written ONCE, at the end, and only on success. Every
          # other exit — a refusal, or the script dying under set -e — leaves it
          # unset, which the review job reads as an empty string and declines.
          # Fail-closed by construction rather than by remembering to write a
          # false on every path out.
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # One acknowledgement, immediately: a command that produces no visible
          # effect for the ~40s before the review job posts anything is
          # indistinguishable from one that was never picked up, and the second
          # thing a human does about that is ask again.
          curl -sS --max-time 30 -K "$CURL_CFG" -X POST \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_FULL/issues/comments/$COMMENT_ID/reactions" \
            -d '{"content":"eyes"}' > /dev/null || true

          PR_JSON=$(curl -sS --max-time 30 -K "$CURL_CFG" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_FULL/pulls/$PR_NUMBER") || PR_JSON=""

          # Each read tolerates a body that is not JSON at all (an HTML error
          # page from a proxy, a truncated response). Without the '|| true' set
          # -e would kill the script mid-parse, and a script that dies here
          # emits no 'proceed' AND no explanation — the command would look
          # ignored, which is the exact failure this whole change exists to
          # remove. An empty HEAD_SHA falls into the refusal below instead.
          HEAD_SHA=$(printf '%s' "$PR_JSON" | jq -r '.head.sha // empty' 2>/dev/null || true)
          HEAD_REPO=$(printf '%s' "$PR_JSON" | jq -r '.head.repo.full_name // empty' 2>/dev/null || true)
          AUTHOR_TYPE=$(printf '%s' "$PR_JSON" | jq -r '.user.type // empty' 2>/dev/null || true)

          refuse() {
            # Say why, in the thread that asked. A silent no-op here is the
            # exact failure mode the label had.
            printf '%s' "$1" | jq -Rs '{body: .}' | \
              curl -sS --max-time 30 -K "$CURL_CFG" -X POST \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO_FULL/issues/$PR_NUMBER/comments" \
                -d @- > /dev/null || true
            exit 0
          }

          if [ -z "$HEAD_SHA" ]; then
            refuse "🦩 Could not read this pull request from the GitHub API, so the review was not started. Try the command again."
          fi

          # The SAME two exclusions the review job applies to every other
          # event, restated here because the job 'if' had nothing to read them
          # from. A fork additionally cannot be waived by any command: this run
          # holds a write token.
          if [ "$HEAD_REPO" != "$REPO_FULL" ]; then
            refuse "🦩 This pull request comes from a fork, so it is not reviewed automatically. Dispatch it from the Flamingo hub instead."
          fi
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            refuse "🦩 This pull request was opened by a bot, so it is not reviewed automatically. Dispatch it from the Flamingo hub instead."
          fi

          # DRAFTS ARE ALLOWED — same rule the on-demand label already follows:
          # an explicit request means it whether or not the PR is finished.

          # Which of the two passes was asked for, in whichever lane asked.
          # A TYPED command is a prefix test; a CHECKED BOX is a substring test,
          # because the box sits inside a whole rendered comment.
          FULL=false
          case "$EVENT_ACTION" in
            edited)
              case "$COMMENT_BODY" in
                *"[x] Review the whole diff again"*) FULL=true ;;
              esac
              ;;
            *)
              case "$COMMENT_BODY" in
                '@flamingo-review full'*) FULL=true ;;
              esac
              ;;
          esac

          # RE-ARM the checkbox by unchecking it. Without this the box stays
          # checked until the next review overwrites the whole comment, so it
          # reads as "already requested" and cannot be clicked again — and on a
          # refused request it would stay checked forever, which is exactly the
          # stranded-state failure the on-demand label was split into its own
          # job to avoid.
          #
          # Best-effort: a review that ran is worth more than a tidy checkbox,
          # and this edit is made by the workflow token, whose events never
          # trigger workflows — so it cannot loop back into this job.
          if [ "$EVENT_ACTION" = "edited" ]; then
            printf '%s' "$COMMENT_BODY" \
              | sed -e 's/\[x\] Review the new commits/[ ] Review the new commits/' \
                    -e 's/\[x\] Review the whole diff again/[ ] Review the whole diff again/' \
              | jq -Rs '{body: .}' \
              | curl -sS --max-time 30 -K "$CURL_CFG" -X PATCH \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO_FULL/issues/comments/$COMMENT_ID" \
                  -d @- > /dev/null || true
          fi

          {
            echo "proceed=true"
            echo "head_sha=$HEAD_SHA"
            echo "full=$FULL"
          } >> "$GITHUB_OUTPUT"

  review:
    # Skip actual work when triggered by push (push only registers the
    # workflow with GitHub, which is what lets workflow_dispatch target a
    # setup branch before the install PR merges).
    # Bots and forks never run, on EVERY event. A fork PR's token is read-only,
    # so the run could not post a comment or a check even if it finished; the
    # bot clause is what stops a hub-opened ai-fix PR from being reviewed into
    # another fix PR, and no label may waive it — "only a human applies a
    # label" is an assumption, not an invariant, since anything holding
    # pull-requests: write can label. To review a bot PR, dispatch it from the
    # hub admin, which is an authenticated, recorded decision.
    #
    # DRAFT is different, and only the on-demand label waives it: an explicit
    # request says "review this now" and means it whether or not the PR is
    # finished, which is how every comparable tool treats its manual trigger.
    # Automatic events and subscribed pushes still skip drafts.
    # NOTE: there is deliberately no vars. kill switch here. The hub's
    # per-repo enabled dial already covers it and answers 409 REVIEW_DISABLED,
    # which produces a recorded run. A second switch living in GitHub would be
    # invisible to the admin screen and would produce no callback at all.
    #
    # A COMMENT COMMAND arrives here already judged: resolve_command made the
    # API calls this expression cannot, and its 'proceed' carries the same two
    # exclusions (fork, bot) plus the "is it really a pull request" answer.
    #
    # 'needs' therefore requires always(): on every OTHER event resolve_command
    # is skipped, and a skipped dependency would otherwise skip this job too —
    # i.e. adding the comment trigger would have silently disabled every
    # existing trigger. always() re-admits them; the clauses below still decide.
    needs: [resolve_command]
    if: >-
      always() &&
      github.event_name != 'push' &&
      (github.event_name == 'repository_dispatch' ||
       needs.resolve_command.outputs.proceed == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        ((github.event.action == 'labeled' &&
          github.event.label.name == 'flamingo-review') ||
         (github.event.action == 'synchronize' &&
          (contains(github.event.pull_request.labels.*.name, 'flamingo-review') ||
           (github.event.pull_request.draft == false &&
            contains(github.event.pull_request.labels.*.name, 'flamingo-review-always')))) ||
         (github.event.action != 'labeled' &&
          github.event.action != 'synchronize' &&
          github.event.pull_request.draft == false))))
    runs-on: ubuntu-latest
    # NO custom timeout-minutes — deliberately. GitHub's 6h hosted-runner
    # ceiling is the only clock: on hitting it the always() report step still
    # runs, so a sweep ships its per-batch checkpoint home and the NEXT sweep
    # resumes from the covered files (nothing is lost, nothing re-paid). Hung
    # runs are the hub reaper's job (run-safety-net-utils.ts, no-report cutoff
    # sized past the platform ceiling) — a second hand-tuned ceiling here was
    # one more number to keep in sync for no added safety.
    steps:
      # Fail LOUD, not silent: a pull_request run on a repo whose org never set
      # FLAMINGO_HUB_BASE_URL would otherwise curl an empty origin and die with
      # an unrelated error. Also normalizes a trailing slash ONCE for every
      # downstream consumer (a value of https://hub.example/ would otherwise
      # yield //api double-slash paths in four places).
      - name: Validate configuration
        run: |
          if [ -z "$HUB_BASE_URL" ]; then
            echo "::error::HUB_BASE_URL is empty — set the org Actions variable FLAMINGO_HUB_BASE_URL (or pass hub_base_url in the dispatch payload)."
            exit 1
          fi
          echo "HUB_BASE_URL=${HUB_BASE_URL%/}" >> "$GITHUB_ENV"

      # REPORT CAPABILITY FIRST. Only workflow-helpers.sh + code-review-report.sh
      # download here — before checkout, cache, or any other script — so every
      # later failure (including the download step for the REST of the scripts
      # 404ing or hash-mismatching, the class that produced phantom 'running'
      # rows) still has a verified report script to call home with.
      - name: Download the report script
        env:
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          SCRIPT_MANIFEST=/tmp/flamingo-script-manifest.json
          # The canonical scripts surface and the pre-rename one. load_script_manifest
          # picks whichever this deployment actually serves and pins SCRIPTS_BASE_URL.
          CI_SCRIPTS_URL="${HUB_BASE_URL%/}/api/ci/scripts"
          LEGACY_SCRIPTS_URL="${HUB_BASE_URL%/}/api/doc-orchestrator/scripts"

          # _try_manifest <base> — 0 loaded, 1 no manifest surface there, 2 fatal.
          _try_manifest() {
            local base="$1" code
            code=$(curl -sS -w '%{http_code}' -o "$SCRIPT_MANIFEST" \
              -H "Authorization: Bearer $WEBHOOK_SECRET" \
              "$base/manifest.json") || code="000"

            if [ "$code" = "404" ]; then rm -f "$SCRIPT_MANIFEST"; return 1; fi
            if [ "$code" != "200" ]; then
              echo "❌ manifest request to $base failed (HTTP $code)"
              rm -f "$SCRIPT_MANIFEST"
              return 2
            fi
            # The digests are the TOP-LEVEL object. successResponse is the standard
            # emitter but it does NOT add a wrapper — it is NextResponse.json(data)
            # plus the no-store header — so there is no .data to reach through.
            # A 200 that is not a manifest is how a hub which does not serve this path
            # answers (the proxy rewrites unknown routes and returns HTML), so it
            # means "wrong surface", not "corrupt".
            if ! jq -e 'type == "object" and length > 0 and (to_entries | all(.value | type == "string"))' "$SCRIPT_MANIFEST" >/dev/null 2>&1; then
              rm -f "$SCRIPT_MANIFEST"
              return 1
            fi
            return 0
          }

          load_script_manifest() {
            # The scripts surface was renamed from /api/doc-orchestrator/scripts to the
            # pipeline-neutral /api/ci/scripts (it always served BOTH pipelines). The
            # workflow file ships in the repo and the routes ship with the deployment,
            # so the two are one version apart in BOTH directions across the rollout.
            # Probe the canonical surface, fall back to the legacy one, and let the
            # winner decide SCRIPTS_BASE_URL for every download that follows.
            # "cmd; rc=$?" dies under the set -euo pipefail these steps run with —
            # errexit fires before rc is read and the step ends with NO output. And
            # "if ! cmd; then rc=$?" is worse: inside the branch $? is the status of
            # the NEGATION (0), so every failure reads as success. "|| rc=$?" is the
            # one form that both suppresses errexit and preserves the real code.
            local rc=0
            _try_manifest "$CI_SCRIPTS_URL" || rc=$?
            if [ "$rc" = "0" ]; then
              SCRIPTS_BASE_URL="$CI_SCRIPTS_URL"
              echo "✅ script manifest loaded ($(jq -r 'length' "$SCRIPT_MANIFEST") scripts)"
              return 0
            fi
            if [ "$rc" = "2" ]; then exit 1; fi

            echo "::warning::this hub does not serve $CI_SCRIPTS_URL — falling back to the legacy $LEGACY_SCRIPTS_URL; it predates the rename"
            SCRIPTS_BASE_URL="$LEGACY_SCRIPTS_URL"

            rc=0
            _try_manifest "$LEGACY_SCRIPTS_URL" || rc=$?
            if [ "$rc" = "0" ]; then
              echo "✅ script manifest loaded ($(jq -r 'length' "$SCRIPT_MANIFEST") scripts)"
              return 0
            fi
            if [ "$rc" = "2" ]; then exit 1; fi

            # Neither surface published a manifest: a hub older than the manifest
            # itself. Downloads proceed UNVERIFIED and say so on every file. Any
            # OTHER failure above already exited — only a genuine "no such endpoint"
            # reaches here, so a hijacked or failing request can never land in this
            # branch and silently disable verification.
            echo "::warning::no manifest endpoint on this hub — it predates the manifest; downloads run UNVERIFIED until the hub is redeployed"
            rm -f "$SCRIPT_MANIFEST"
          }

          download_and_verify() {
            local script_name="$1"
            local output_path="/tmp/$script_name"

            local expected_hash=""
            if [ -f "$SCRIPT_MANIFEST" ]; then
              expected_hash=$(jq -r --arg n "$script_name" '.[$n] // empty' "$SCRIPT_MANIFEST")
              if [ -z "$expected_hash" ]; then
                echo "❌ $script_name is not in the server's script manifest!"
                echo "   The hub serves no such script, or it failed to read on the server."
                exit 1
              fi
            fi

            curl -fsSL "$SCRIPTS_BASE_URL/$script_name" \
              -H "Authorization: Bearer $WEBHOOK_SECRET" \
              -o "$output_path"

            local actual_hash=$(shasum -a 256 "$output_path" | cut -d' ' -f1)

            if [ -z "$expected_hash" ]; then
              echo "::warning::$script_name downloaded UNVERIFIED (no manifest; hash: ${actual_hash:0:16}...)"
            elif [ "$actual_hash" != "$expected_hash" ]; then
              echo "❌ HASH MISMATCH for $script_name!"
              echo "   Expected: $expected_hash"
              echo "   Actual:   $actual_hash"
              echo "   The download was corrupted in transit — both values come from the same deployment."
              exit 1
            fi

            # Make shell scripts executable
            if [[ "$script_name" == *.sh ]]; then
              chmod +x "$output_path"
            fi

            if [ -n "$expected_hash" ]; then
              echo "✅ $script_name verified (hash: ${actual_hash:0:16}...)"
            fi
          }

          load_script_manifest
          download_and_verify "workflow-helpers.sh"
          download_and_verify "code-review-report.sh"

      # Early liveness ping — the FIRST real step after report capability is
      # secured. Stamps workflow_run_id + status 'running' on the hub's run row,
      # so "dispatch accepted but nothing ever ran" (no ping — reaped fast) is
      # distinguishable from "started, then crashed" (pinged — longer deadline).
      # Best-effort by design: the script exits 0 regardless; the always()
      # report below is the authoritative callback.
      - name: Tell the hub the run started
        env:
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
          RUN_TOKEN: ${{ github.event.client_payload.run_token || github.event.inputs.run_token || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.resolve_command.outputs.head_sha || github.sha }}
          WF_RUN_ID: ${{ github.run_id }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || needs.resolve_command.outputs.pr_number }}
        run: /tmp/code-review-report.sh --started

      # v5 = the Node 24 drop-in (v4 targets EOL Node 20 and warns on every run).
      - name: Check out the code under review
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A pull_request run is already checked out at the right ref, and a
          # dispatch wants the branch it targeted — both leave this EMPTY,
          # which is checkout's own "use the triggering ref" default.
          #
          # An issue_comment run is the exception and the reason this line
          # exists: that event's ref is the DEFAULT BRANCH, not the pull
          # request. Without an explicit ref the command would cheerfully
          # review main and report the result onto someone's PR.
          #
          # Pinned to the SHA resolve_command read, not to refs/pull/N/head:
          # the sha is what the run reports on, what the incremental anchor is
          # compared against, and what the check lands on. Resolving the ref a
          # second time here could pick up a push that landed in between and
          # review a different commit than the one recorded.
          ref: ${{ needs.resolve_command.outputs.head_sha }}
          # The review job must never hold a push credential.
          persist-credentials: false

      # The corpus hash has to SURVIVE between runs, or the hash param is empty
      # and the 304 path the hub implements is unreachable — the corpus would be
      # transferred in full on every run in both modes.
      # v5 = the Node 24 drop-in (v4 targets EOL Node 20 and warns on every run).
      - name: Restore the last corpus hash
        uses: actions/cache@v5
        with:
          # BOTH files. Caching only the hash meant a 304 left rules.json
          # truncated to zero bytes while the run continued as if it had a
          # corpus.
          path: |
            .rules-hash
            rules.json
          key: flamingo-rules-hash-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            flamingo-rules-hash-${{ github.repository }}-

      # The SAME download_and_verify function as the doc-orchestrator workflow
      # (single source: lib/config/workflow-scripts-bootstrap.ts, parity with
      # the doc template asserted at build time), fetching from the SAME
      # scripts endpoint. This bootstrap (and the report-capability step above,
      # which shares it) is the ONLY inline bash in the file — every other step
      # runs a verified unified script, so a script change ships from the hub
      # without touching this caller. Helpers + report already downloaded above;
      # this step fetches the rest, and its failure is REPORTABLE.
      - name: Download and verify scripts
        env:
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          SCRIPT_MANIFEST=/tmp/flamingo-script-manifest.json
          # The canonical scripts surface and the pre-rename one. load_script_manifest
          # picks whichever this deployment actually serves and pins SCRIPTS_BASE_URL.
          CI_SCRIPTS_URL="${HUB_BASE_URL%/}/api/ci/scripts"
          LEGACY_SCRIPTS_URL="${HUB_BASE_URL%/}/api/doc-orchestrator/scripts"

          # _try_manifest <base> — 0 loaded, 1 no manifest surface there, 2 fatal.
          _try_manifest() {
            local base="$1" code
            code=$(curl -sS -w '%{http_code}' -o "$SCRIPT_MANIFEST" \
              -H "Authorization: Bearer $WEBHOOK_SECRET" \
              "$base/manifest.json") || code="000"

            if [ "$code" = "404" ]; then rm -f "$SCRIPT_MANIFEST"; return 1; fi
            if [ "$code" != "200" ]; then
              echo "❌ manifest request to $base failed (HTTP $code)"
              rm -f "$SCRIPT_MANIFEST"
              return 2
            fi
            # The digests are the TOP-LEVEL object. successResponse is the standard
            # emitter but it does NOT add a wrapper — it is NextResponse.json(data)
            # plus the no-store header — so there is no .data to reach through.
            # A 200 that is not a manifest is how a hub which does not serve this path
            # answers (the proxy rewrites unknown routes and returns HTML), so it
            # means "wrong surface", not "corrupt".
            if ! jq -e 'type == "object" and length > 0 and (to_entries | all(.value | type == "string"))' "$SCRIPT_MANIFEST" >/dev/null 2>&1; then
              rm -f "$SCRIPT_MANIFEST"
              return 1
            fi
            return 0
          }

          load_script_manifest() {
            # The scripts surface was renamed from /api/doc-orchestrator/scripts to the
            # pipeline-neutral /api/ci/scripts (it always served BOTH pipelines). The
            # workflow file ships in the repo and the routes ship with the deployment,
            # so the two are one version apart in BOTH directions across the rollout.
            # Probe the canonical surface, fall back to the legacy one, and let the
            # winner decide SCRIPTS_BASE_URL for every download that follows.
            # "cmd; rc=$?" dies under the set -euo pipefail these steps run with —
            # errexit fires before rc is read and the step ends with NO output. And
            # "if ! cmd; then rc=$?" is worse: inside the branch $? is the status of
            # the NEGATION (0), so every failure reads as success. "|| rc=$?" is the
            # one form that both suppresses errexit and preserves the real code.
            local rc=0
            _try_manifest "$CI_SCRIPTS_URL" || rc=$?
            if [ "$rc" = "0" ]; then
              SCRIPTS_BASE_URL="$CI_SCRIPTS_URL"
              echo "✅ script manifest loaded ($(jq -r 'length' "$SCRIPT_MANIFEST") scripts)"
              return 0
            fi
            if [ "$rc" = "2" ]; then exit 1; fi

            echo "::warning::this hub does not serve $CI_SCRIPTS_URL — falling back to the legacy $LEGACY_SCRIPTS_URL; it predates the rename"
            SCRIPTS_BASE_URL="$LEGACY_SCRIPTS_URL"

            rc=0
            _try_manifest "$LEGACY_SCRIPTS_URL" || rc=$?
            if [ "$rc" = "0" ]; then
              echo "✅ script manifest loaded ($(jq -r 'length' "$SCRIPT_MANIFEST") scripts)"
              return 0
            fi
            if [ "$rc" = "2" ]; then exit 1; fi

            # Neither surface published a manifest: a hub older than the manifest
            # itself. Downloads proceed UNVERIFIED and say so on every file. Any
            # OTHER failure above already exited — only a genuine "no such endpoint"
            # reaches here, so a hijacked or failing request can never land in this
            # branch and silently disable verification.
            echo "::warning::no manifest endpoint on this hub — it predates the manifest; downloads run UNVERIFIED until the hub is redeployed"
            rm -f "$SCRIPT_MANIFEST"
          }

          download_and_verify() {
            local script_name="$1"
            local output_path="/tmp/$script_name"

            local expected_hash=""
            if [ -f "$SCRIPT_MANIFEST" ]; then
              expected_hash=$(jq -r --arg n "$script_name" '.[$n] // empty' "$SCRIPT_MANIFEST")
              if [ -z "$expected_hash" ]; then
                echo "❌ $script_name is not in the server's script manifest!"
                echo "   The hub serves no such script, or it failed to read on the server."
                exit 1
              fi
            fi

            curl -fsSL "$SCRIPTS_BASE_URL/$script_name" \
              -H "Authorization: Bearer $WEBHOOK_SECRET" \
              -o "$output_path"

            local actual_hash=$(shasum -a 256 "$output_path" | cut -d' ' -f1)

            if [ -z "$expected_hash" ]; then
              echo "::warning::$script_name downloaded UNVERIFIED (no manifest; hash: ${actual_hash:0:16}...)"
            elif [ "$actual_hash" != "$expected_hash" ]; then
              echo "❌ HASH MISMATCH for $script_name!"
              echo "   Expected: $expected_hash"
              echo "   Actual:   $actual_hash"
              echo "   The download was corrupted in transit — both values come from the same deployment."
              exit 1
            fi

            # Make shell scripts executable
            if [[ "$script_name" == *.sh ]]; then
              chmod +x "$output_path"
            fi

            if [ -n "$expected_hash" ]; then
              echo "✅ $script_name verified (hash: ${actual_hash:0:16}...)"
            fi
          }

          # Digests come from the deployment that serves the bytes, never from
          # this file: a pinned hash here would be the PR head ref's while the
          # scripts are main's, which is exactly how a PR used to brick its own
          # review. See workflow-scripts-bootstrap.ts.
          load_script_manifest

          download_and_verify "code-review-fetch-rules.sh"
          download_and_verify "code-review-run.sh"
          download_and_verify "code-review-mine.mjs"
          download_and_verify "code-review-review.mjs"
          download_and_verify "code-review-lib.mjs"
          download_and_verify "code-review-post.mjs"

      - name: Fetch the rule corpus
        id: rules
        env:
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
          # PR runs identify the pull request so the hub can answer with the
          # last successfully reviewed head SHA (X-Last-Reviewed-Sha) — the
          # incremental-review anchor persisted as .last-reviewed-sha.
          PR_NUMBER: ${{ github.event.pull_request.number || needs.resolve_command.outputs.pr_number }}
          # '@flamingo-review full' asks the hub to WITHHOLD that anchor,
          # so this pass re-reads the pull request's whole cumulative diff.
          # Empty on every other trigger, which keeps them incremental.
          REVIEW_FULL: ${{ needs.resolve_command.outputs.full }}
        run: /tmp/code-review-fetch-rules.sh

      # Stage checkpoints are their OWN credentialed steps — the review step
      # deliberately never holds the webhook secret or run token (it processes
      # untrusted PR content), so pings happen at step boundaries, not inside.
      # Say so ON THE PULL REQUEST before spending minutes in the model. Placed
      # AFTER the rules step on purpose: the skip decision is known here, so a run that
      # reviews nothing never leaves a placeholder to strand. The comment
      # carries the summary marker, so the final "Post to the pull request"
      # step UPDATES this exact comment into the verdict rather than adding a
      # second one, and it is re-created (not edited) each run so the live
      # review sits at the BOTTOM of the timeline instead of scrolling away
      # under later discussion. Best-effort: never fails the review.
      - name: Say the review is running
        if: steps.rules.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || needs.resolve_command.outputs.pr_number }}
        # Feature-DETECTED, not assumed: across a deploy boundary this workflow
        # can be handed a post.mjs that predates --running, which would ignore
        # the flag and run the full post pass with no findings.json — posting a
        # bogus verdict mid-review. Grep first; skip quietly if unsupported.
        run: |
          if grep -q -- '--running' /tmp/code-review-post.mjs; then
            node /tmp/code-review-post.mjs --running
          else
            echo "the hub's post.mjs predates --running — skipping the placeholder"
          fi

      - name: Report progress — reviewing
        env:
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
          RUN_TOKEN: ${{ github.event.client_payload.run_token || github.event.inputs.run_token || '' }}
          WF_RUN_ID: ${{ github.run_id }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || needs.resolve_command.outputs.pr_number }}
        run: /tmp/code-review-report.sh --progress review

      - name: Review
        # The id lets the report step read the reviewer's own degraded output
        # (e.g. skipped_trivial_diff) alongside the rules step's.
        id: review
        if: steps.rules.outputs.skip != 'true'
        # MODE / RUN_ID arrive via the generated workflow-level env; only the
        # secret is scoped to the step (doc-workflow security discipline).
        # The reviewer calls Claude THROUGH THE HUB (/api/ci/claude, the
        # unified caller), so the step carries the hub's workflow secret and
        # the target repo needs no ANTHROPIC_API_KEY of its own.
        #
        # ANTHROPIC_API_KEY is still passed as a TRANSITION SHIM. The scripts
        # are served by the deployed hub while this workflow file ships in the
        # repo, so across a deploy boundary a NEW workflow runs OLD scripts —
        # and the old ones call Anthropic directly. Withdrawing the key the
        # same day the proxy landed would kill every review until the hub went
        # live, including the review of the pull request that moved it. Drop
        # this line once the fleet is on scripts that no longer read it.
        env:
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: /tmp/code-review-run.sh

      # Post the findings to the PULL REQUEST itself and publish the
      # 'Flamingo Code Review' check run. pull_request events only — a sweep
      # has no PR to post to (its findings live in the hub dashboard). Uses the
      # runner's own GITHUB_TOKEN under the workflow's minimal grant
      # (pull-requests: write for the comments, checks: write for the check
      # run). One UPSERTED summary comment + inline comments where the diff
      # supports them; already-posted fingerprints are never re-commented, so
      # a new push adds only NEW findings. The check run is 'neutral' unless
      # the repo's served mode is 'blocking' AND action_required findings
      # exist. Writes posted.json (fingerprint -> comment id) for the report
      # step's callback — the reaction-learning loop reads it.
      - name: Report progress — finalizing
        env:
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
          RUN_TOKEN: ${{ github.event.client_payload.run_token || github.event.inputs.run_token || '' }}
          WF_RUN_ID: ${{ github.run_id }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || needs.resolve_command.outputs.pr_number }}
        run: /tmp/code-review-report.sh --progress post

      - name: Post to the pull request
        id: post
        if: github.event_name == 'pull_request' && steps.rules.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEGRADED: ${{ steps.review.outputs.degraded }}
          PR_NUMBER: ${{ github.event.pull_request.number || needs.resolve_command.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.resolve_command.outputs.head_sha }}
        run: node /tmp/code-review-post.mjs

      # A crashed Review step must still leave a trace ON THE PR: default
      # step-skip semantics silently skip the post step on failure, so the
      # developer saw no signal at all that a review was attempted — the
      # failure lived only on the hub's internal dashboard. Best-effort (|| 
      # true): a failed courtesy comment must not mask the real failure state.
      - name: Post crash notice to the pull request
        if: failure() && github.event_name == 'pull_request' && steps.review.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || needs.resolve_command.outputs.pr_number }}
          REPO_FULL: ${{ github.repository }}
          WF_RUN_ID: ${{ github.run_id }}
        run: |
          BODY="🦩 **Flamingo Code Review crashed on this push.** No findings were posted — this is an infrastructure failure, not a clean review. See the [workflow run](https://github.com/$REPO_FULL/actions/runs/$WF_RUN_ID)."
          CURL_CFG=$(mktemp) && chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN" > "$CURL_CFG"
          curl -s -K "$CURL_CFG" -X POST "https://api.github.com/repos/$REPO_FULL/issues/$PR_NUMBER/comments" \
            -H "Content-Type: application/json" \
            --data "$(printf '%s' "$BODY" | jq -Rs '{body: .}')" > /dev/null || true
          rm -f "$CURL_CFG"

      # The report script downloads FIRST (dedicated step above), so a missing
      # /tmp/code-review-report.sh here means the report-capability bootstrap
      # itself failed (endpoint down, hash mismatch before anything else ran).
      # The guarded inline curl below still posts a minimal failure callback for
      # exactly that case; the hub's tiered reaper remains the last resort.
      - name: Report back to the hub
        if: always() && env.HUB_BASE_URL != ''
        # RUN_ID / MODE / HUB_BASE_URL arrive via the generated workflow-level
        # env. RUN_TOKEN is SENSITIVE (per-run bearer) so it is step-scoped
        # HERE — the only consumer — and masked by the script; the review step
        # that processes untrusted PR content never sees it. Remaining step env
        # is the secret plus values that exist nowhere but the GitHub context —
        # which enters through env, never interpolated into a script body.
        env:
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
          RUN_TOKEN: ${{ github.event.client_payload.run_token || github.event.inputs.run_token || '' }}
          JOB_STATUS: ${{ job.status }}
          # Either step can degrade a run: the rules step (corpus unavailable)
          # or the reviewer itself (trivial-diff skip, unresolvable PR base).
          DEGRADED: ${{ steps.rules.outputs.degraded || steps.review.outputs.degraded }}
          # Dispatch events carry no pull_request context — github.sha is the
          # tip of the checked-out ref, so sweep runs record the commit too.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.resolve_command.outputs.head_sha || github.sha }}
          WF_RUN_ID: ${{ github.run_id }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || needs.resolve_command.outputs.pr_number }}
        # The ONE justified inline-bash exception beyond the bootstrap: when the
        # report script itself never downloaded, no unified script exists to
        # report the failure — so a minimal guarded curl posts it. Kept tiny on
        # purpose; all real reporting logic stays in code-review-report.sh.
        run: |
          if [ ! -x /tmp/code-review-report.sh ]; then
            echo "::error::code-review-report.sh missing — sending bootstrap-failure callback"
            # Secrets NEVER ride argv (ps-visible): the bearer goes through a
            # 0600 curl config file and RUN_TOKEN through jq's env — the same
            # transport rule the report script itself follows.
            CURL_CFG=$(mktemp) && chmod 600 "$CURL_CFG"
            printf 'header = "Authorization: Bearer %s"\n' "$WEBHOOK_SECRET" > "$CURL_CFG"
            jq -n --arg run_id "${RUN_ID:-}" \
              --arg wf "$WF_RUN_ID" --arg repo "$REPO_FULL" --arg mode "$MODE" \
              '{run_id: $run_id, run_token: ($ENV.RUN_TOKEN // ""), status: "failure",
                degraded_reason: "bootstrap_failed", workflow_run_id: $wf,
                repo_full_name: $repo, mode: $mode,
                error_message: "Script bootstrap failed: the report script never downloaded from the hub."}' |
              curl -sS --max-time 30 -K "$CURL_CFG" -X POST "$HUB_BASE_URL/api/code-review/webhook" \
                -H "Content-Type: application/json" -d @- || true
            rm -f "$CURL_CFG"
            exit 1
          fi
          /tmp/code-review-report.sh
