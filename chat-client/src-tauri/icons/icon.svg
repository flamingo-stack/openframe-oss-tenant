<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="250" fill="url(#grad1)"/>
  
  <!-- Chat Bubble Icon -->
  <g transform="translate(256, 256)">
    <!-- Main bubble -->
    <path d="M -120 -80 
             Q -140 -80 -140 -60
             L -140 40
             Q -140 60 -120 60
             L 80 60
             Q 100 60 100 40
             L 100 -60
             Q 100 -80 80 -80
             Z
             M -20 60
             L -60 100
             L -20 80
             Z" 
          fill="white" 
          opacity="0.95"/>
    
    <!-- Chat lines -->
    <rect x="-100" y="-40" width="120" height="8" rx="4" fill="#667eea"/>
    <rect x="-100" y="-10" width="160" height="8" rx="4" fill="#667eea"/>
    <rect x="-100" y="20" width="100" height="8" rx="4" fill="#667eea"/>
  </g>
</svg>