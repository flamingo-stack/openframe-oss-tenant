server:
  port: 8095

# Management service common configuration
spring:
  data:
    mongodb:
      enabled: true
    cassandra:
      enabled: false
  cloud:
    config:
      fail-fast: false
    stream:
      enabled: true
  autoconfigure:
    exclude:
      # Transition: each entry is listed under its Spring Boot 3 name, then its Spring Boot 4 one; Spring Boot skips
      # names it does not have. Drop the Spring Boot 3 names once every service runs Spring Boot 4.
      - org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration
      - org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraReactiveDataAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.cassandra.CassandraHealthContributorAutoConfiguration
      - org.springframework.boot.cassandra.autoconfigure.health.CassandraHealthContributorAutoConfiguration
  oss-tenant:
    kafka:
      bootstrap-servers: kafka.datasources.svc.cluster.local:9092
      enabled: true

# Management server configuration
management:
  server:
    port: 8096
  health:
    cassandra:
      enabled: false

  # API Key Statistics configuration
openframe:
  api-key-stats:
    enabled: true
    sync-interval: 300000  # 5 minutes in milliseconds
    lock-at-most-for: "10m"  # Maximum lock duration
    lock-at-least-for: "1m"

  oss-tenant:
    kafka:
      topics:
        inbound:
          delivery-dispatch:
            name: delivery-dispatch
        outbound:
          devices-topic:
            name: devices-topic

  gateway:
    oauth:
      client-id: ${OPENFRAME_AUTH_CLIENT_ID:openframe-gateway}
      client-secret: ${OPENFRAME_AUTH_SECRET:}
      redirect-uri: ${TENANT_HOST_URL:https://localhost}/oauth/callback

  debezium:
    base-url: http://debezium-connect.datasources:8083
    health-check:
      enabled: true
      interval: 300000  # 5 minutes in milliseconds
      lock-at-most-for: "5m"
      lock-at-least-for: "1m"

  integration:
    tool:
      enabled: true

  management:
    idp:
      init:
        enabled: true

    agent-configurations:
      - agent-configurations/fleetmdm-agent.json
      - agent-configurations/meshcentral-agent.json

security:
  oauth2:
    token:
      access:
        expiration-seconds: 900
      refresh:
        expiration-seconds: 604800

nats:
  spring:
    server: ${NATS_SERVER:nats://nats.datasources.svc.cluster.local:4222}
    username: ${NATS_USERNAME:service}
    password: ${NATS_PASSWORD:}
    connection-timeout: 30s
    max-reconnect: 10
    reconnect-wait: 5s
    ping-interval: 30s
    no-echo: true

pinot:
  tables:
    devices:
      name: devices
    logs:
      name: logs
