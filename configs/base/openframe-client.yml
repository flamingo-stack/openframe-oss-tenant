  issuer: https://auth.openframe.com
  audience: openframe-client
  publicKey:
    value: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2hOutXmTOhEp7FHCXRpn
      6rkyeQRStHcNe5GF/+6fejfP7N4lIAe33YGyrlLB8++p2/RcWYd6ZBNb7mYX/XaI
      cRpsgraHxMjsQ8Lyio8QkuDX7HFzW5W4MFGMSBYv8zK95FNPGGK2LEdRf+DtaYzk
      XpqrkJTgfw7jFqEVCiC9Eg6ryHO0UppDjb8ho2XZIpWgAcW4Qf+iXaRWCR+FN4tR
      9LF/vBmqH13CQD9jazqSTR5mMp9ih9sG0SqEAYxAhENXtLjf+yH2uDplu0RaFkuv
      ec8Qg5aglrDzTK4wpF1avJXCmndDt2VbfMMCehiLI31LPm8qNoJo87KF71gvE+kW
      cQIDAQAB
      -----END PUBLIC KEY-----
  privateKey:
    value: ${JWT_PRIVATE_KEY:}

oauth:
  client:
    default:
      grant-types:
        - client_credentials
      scopes:
        - agent

openframe:
  delivery:
    dispatch-group: openframe-client-delivery-dispatch
  # RMM features of the shared libs: script execution watchdog/retry, schedules, device-online dispatch
  rmm:
    execution:
      watchdog:
        enabled: true
        interval: 60000
        grace-seconds: 120
        threshold-seconds: 600
        lock-at-most-for: 2m
        lock-at-least-for: 10s
      retry:
        enabled: true
        size: 3
        ttl-seconds: 3600
        interval: 30000
        lock-at-most-for: 2m
        lock-at-least-for: 10s
      queued:
        threshold-seconds: 30
    schedule:
      runner:
        enabled: true
      watchdog:
        enabled: true
        interval: 60000
        threshold-seconds: 900
      device-local:
        catchup-seconds: 1800
    device-online:
      dispatch:
        interval: 20000
        batch-size: 500
        lock-at-most-for: 2m
        lock-at-least-for: 10s
    package-manager-bootstrap:
      cooldown-seconds: 1800
      enabled: true
    software:
      enabled: true
  oss-tenant:
    kafka:
      topics:
        outbound:
          devices-topic:
            name: devices-topic
          logs-events:
            name: logs.events
  integration:
    tool:
      enabled: true
