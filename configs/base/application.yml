# Common properties shared across all services
spring:
  mongodb:
    uri: &mongo-uri mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb-0.mongodb.datasources.svc.cluster.local:27017/openframe?authSource=admin&connectTimeoutMS=10000&socketTimeoutMS=10000&serverSelectionTimeoutMS=10000
  main:
    allow-bean-definition-overriding: true
  mvc:
    contentnegotiation:
      favor-parameter: true
      media-types:
        actuator: application/vnd.spring-boot.actuator.v3+json
  autoconfigure:
    exclude:
      # Transition: each entry is listed under its Spring Boot 3 name, then its Spring Boot 4 one; Spring Boot skips
      # names it does not have. Drop the Spring Boot 3 names once every service runs Spring Boot 4.
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
  data:
    spring:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:redis-cluster-0.redis-cluster-headless.datasources.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.datasources.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.datasources.svc.cluster.local:6379}
        max-redirects: 3
    # Common MongoDB configuration
    mongodb:
      # Transition: Spring Boot 3 services read spring.data.mongodb.uri, Spring Boot 4 ones spring.mongodb.uri.
      # Remove this key once every service runs Spring Boot 4.
      uri: *mongo-uri
      auto-index-creation: true
      connect-timeout: 10000
      socket-timeout: 10000
      max-wait-time: 10000
      server-selection-timeout: 10000
    # Common Cassandra configuration
    cassandra:
      contact-points: cassandra.datasources.svc.cluster.local
      port: 9042
      local-datacenter: datacenter1
      keyspace-name: openframe_events
      schema-action: CREATE_IF_NOT_EXISTS
      request:
        timeout: 20s
      connection:
        connect-timeout: 20s
        init-query-timeout: 20s
      controlconnection:
        timeout: 20s
      advanced:
        timestamp-generator:
          class: com.datastax.oss.driver.internal.core.time.ServerSideTimestampGenerator

# Common monitoring configuration
management:
  base-path: /management
  endpoints:
    web:
      base-path: /management/${RELEASE_VERSION:v1}
      exposure:
        include: health,info,metrics,prometheus
    access:
      default: read-only
  endpoint:
    prometheus:
      access: read-only
    health:
      access: read-only
      show-details: always
    metrics:
      access: read-only
  metrics:
    enable:
      all: true
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Common security configuration
security:
  oauth2:
    token:
      access:
        expiration-seconds: 3600  # 10 minute
      refresh:
        expiration-seconds: 604800  # 1 week (7 * 24 * 60 * 60)
        max-refresh-count: 10080    # Maximum refreshes in a week (7 * 24 * 60)        
  encryption:
    password: ${ENCRYPTION_PASSWORD}
    salt: ${ENCRYPTION_SALT}

logging:
  config: ${SPRING_CONFIG_URL:http://openframe-config.platform.svc.cluster.local:8888}/logging/shared-logback-spring-logfmt.xml
  file:
    path: logs
  level:
    root: INFO
    # OpenFrame specific
    com.openframe: INFO
    com.openframe.data.config: INFO

    # Cassandra related
    org.springframework.data.cassandra: INFO
    com.datastax.oss.driver: INFO

    # Spring Boot Actuator
    org.springframework.boot.actuate: INFO
    org.springframework.boot.actuate.metrics: INFO
    org.springframework.boot.actuate.endpoint: INFO
    org.springframework.boot.actuate.endpoint.web: INFO
    org.springframework.boot.actuate.autoconfigure.metrics: INFO
    org.springframework.boot.actuate.metrics.export.prometheus: INFO

    # Micrometer & Prometheus
    io.micrometer: INFO
    io.micrometer.prometheus: INFO
    io.micrometer.core.instrument.logging: INFO

    # Spring Web
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.web.servlet.handler: INFO  # For detailed request mapping
    org.springframework.boot.web: INFO

    # Spring Cloud
    org.springframework.cloud.config: INFO

    # Logback
    ch.qos.logback: INFO
    # Security & CORS debugging
    org.springframework.security: INFO
    org.springframework.security.web: INFO
    com.openframe.security: INFO

openframe:
  cluster-id: ${OPENFRAME_CLUSTER_ID:cluster-id}
  presence:
    ttl-seconds: 30
  # Machine delivery engine from the shared libs (openframe-machine-delivery). Every delivery type is off unless
  # listed under openframe.delivery.enabled; the libs require the policy below.
  delivery:
    dispatch-topic: delivery-dispatch
    sweep:
      enabled: false
      interval: 30000
      lock-at-most-for: 2m
      lock-at-least-for: 10s
      batch-size: 500
    defaults:
      ack-threshold-seconds: 30
      max-attempts: 3
      backoff:
        multiplier: 2
        max-interval-seconds: 300
        jitter: 0.0
      offline-behavior: RETRY_ON_RECONNECT
      reconnect-window-seconds: 86400
      result-timeout-seconds: 600
      ttl-seconds: 604800
  # See the comment block at the end of this file: OSS runs the shared libs in
  # tenant-isolation mode so the tenant-aware repositories (and their
  # TenantAwareMongoTemplate) exist — without it every Java service crash-loops
  # on startup with lib >= 6.16.
  tenant-isolation:
    enabled: true
  redis:
    tenant-id: default
  client:
    update:
      feature:
        enabled: true
  tool-agent:
    update:
      feature:
        enabled: true
# Docker environment specific configuration

# Docker monitoring endpoints
loki:
  url: http://loki.platform.svc.cluster.local:3100/loki/api/v1/push

# Pinot connection details
pinot:
  controller:
    url: pinot-controller.datasources.svc.cluster.local:9000
  broker:
    url: pinot-broker.datasources.svc.cluster.local:8099

debezium:
  connector:
    create: http://debezium-connect.datasources:8083/connectors

# OSS single-tenant deployments run the shared libs in tenant-isolation mode:
# lib >= 6.16 registers services (notifications, tickets, knowledge base, ...)
# that constructor-require @TenantAwareRepository repositories, and those are
# only enabled by TenantAwareSyncConfig when this flag is on (MongoSyncConfig,
# the non-isolated variant, deliberately excludes them — leaving the beans
# unsatisfiable and every service crash-looping at startup). With the flag on,
# reads and writes also agree on the tenant id (TenantIdProvider), fixing the
# openframe_client_configuration E11000 self-collision on first boot.
# Requires openframe-oss-lib >= the release with TenantAwareInfraConfig (the
# mongoTemplate/TenantAwareMongoTemplate bean) — see the lib-side fix.

