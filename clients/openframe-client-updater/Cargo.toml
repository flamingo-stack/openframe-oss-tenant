[package]
name = "openframe-client-updater"
version = "0.1.0"
edition = "2021"
authors = ["Flamingo Team"]
description = "OpenFrame - Client updater service"
license = "MIT"

[[bin]]
name = "openframe-client-updater"
path = "src/main.rs"

[lib]
name = "openframe_updater"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["attributes", "async-await"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json", "native-tls"] }
async-nats = { git = "https://github.com/flamingo-stack/nats.rs.git", branch = "main", features = ["websockets"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
semver = "1.0"
uuid = { version = "1.7", features = ["v4"] }
bytes = "1.10.1"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
clap = { version = "4.5", features = ["derive", "env", "std"] }
directories = "5.0"
service-manager = "0.8"
plist = "1.7.1"
rustls-pemfile = "1.0"
aes-gcm = "0.10"
base64 = "0.21"
tokio-rustls = "0.24"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
is_elevated = "0.1"
windows-service = "0.6"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winapi = { version = "0.3", features = ["winuser", "shellapi", "securitybaseapi", "errhandlingapi", "winerror"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "2.4"
